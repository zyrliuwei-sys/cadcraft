<rect width="960" height="492" fill="#f8fafb"/><g font-family="IBM Plex Sans,Segoe UI,Arial,sans-serif"><text x="32" y="43" font-size="28" fill="#17252e" font-weight="700" text-anchor="start">CADCraft on GitHub: choose your route</text><text x="32" y="72" font-size="17" fill="#596a76" font-weight="400" text-anchor="start">storytold/cadcraft · official upstream repository</text><rect x="32" y="103" width="340" height="87" rx="8" fill="white" stroke="#cbd5da"/><text x="50" y="134" font-size="20" fill="#17252e" font-weight="600" text-anchor="start">Install the desktop app</text><text x="50" y="164" font-size="16" fill="#596a76" font-weight="400" text-anchor="start">Choose your OS + processor</text><path d="M384 146 L424 146" stroke="#596a76" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="439" y="103" width="489" height="87" rx="8" fill="#eef5f7" stroke="#cbd5da"/><text x="457" y="134" font-size="21" fill="#24617a" font-weight="700" text-anchor="start">Releases → Assets</text><text x="457" y="164" font-size="16" fill="#596a76" font-weight="400" text-anchor="start">Compiled installer or portable package</text><rect x="32" y="212" width="340" height="87" rx="8" fill="white" stroke="#cbd5da"/><text x="50" y="243" font-size="20" fill="#17252e" font-weight="600" text-anchor="start">Work with the source</text><text x="50" y="273" font-size="16" fill="#596a76" font-weight="400" text-anchor="start">Rust workspace + source files</text><path d="M384 255 L424 255" stroke="#596a76" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="439" y="212" width="489" height="87" rx="8" fill="#fff4eb" stroke="#cbd5da"/><text x="457" y="243" font-size="21" fill="#c85e24" font-weight="700" text-anchor="start">Code → tagged checkout</text><text x="457" y="273" font-size="16" fill="#596a76" font-weight="400" text-anchor="start">Compile it yourself; no ready-made app</text><rect x="32" y="321" width="340" height="87" rx="8" fill="white" stroke="#cbd5da"/><text x="50" y="352" font-size="20" fill="#17252e" font-weight="600" text-anchor="start">Try it in a browser</text><text x="50" y="382" font-size="16" fill="#596a76" font-weight="400" text-anchor="start">WebAssembly application</text><path d="M384 364 L424 364" stroke="#596a76" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="439" y="321" width="489" height="87" rx="8" fill="#eef5f7" stroke="#cbd5da"/><text x="457" y="352" font-size="21" fill="#24617a" font-weight="700" text-anchor="start">Hosted editor</text><text x="457" y="382" font-size="16" fill="#596a76" font-weight="400" text-anchor="start">A hosted build can be an older version</text><text x="32" y="454" font-size="17" fill="#596a76" font-weight="400" text-anchor="start">Source code ZIP ≠ desktop application · cadcraft-web ZIP ≠ Android APK</text>
