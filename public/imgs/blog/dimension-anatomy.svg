<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 470' width='980' height='470' role='img' aria-label='The anatomy of an AutoCAD dimension: extension lines run from the measured object, the dimension line with arrowheads at both ends spans them, and the text in the middle is measured from the geometry. DIMLINEAR reports the horizontal or vertical distance between two points; DIMALIGNED follows the angle of the two points, shown measuring an angled wall at 3000 against a horizontal 2828'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker></defs><rect width='980' height='470' fill='#f8fafc'/><text x='30' y='42' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#111827'>Anatomy of a dimension</text><rect x='30' y='70' width='560' height='330' rx='10' fill='#ffffff' stroke='#d1d5db'/><text x='48' y='98' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15.5' font-weight='700' fill='#111827'>The parts</text><line x1='80' y1='330' x2='480' y2='330' stroke='#111827' stroke-width='4'/><line x1='110' y1='322' x2='110' y2='180' stroke='#6b7280' stroke-width='1'/><line x1='450' y1='322' x2='450' y2='180' stroke='#6b7280' stroke-width='1'/><line x1='110' y1='200' x2='450' y2='200' stroke='#0891b2' stroke-width='1.2'/><path d='M110,200 L122,196 L122,204 Z' fill='#0891b2'/><path d='M450,200 L438,196 L438,204 Z' fill='#0891b2'/><text x='280' y='192' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#0e7490'>2400</text><line x1='255' y1='188' x2='200' y2='140' stroke='#9ca3af' stroke-width='1' stroke-dasharray='3,3' marker-end='url(#a)'/><text x='120' y='134' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#4b5563'>measured text — read from the geometry</text><line x1='380' y1='200' x2='405' y2='152' stroke='#9ca3af' stroke-width='1' stroke-dasharray='3,3' marker-end='url(#a)'/><text x='330' y='146' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#4b5563'>dimension line</text><line x1='447' y1='235' x2='470' y2='270' stroke='#9ca3af' stroke-width='1' stroke-dasharray='3,3' marker-end='url(#a)'/><text x='400' y='290' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#4b5563'>extension line</text><line x1='118' y1='206' x2='140' y2='240' stroke='#9ca3af' stroke-width='1' stroke-dasharray='3,3' marker-end='url(#a)'/><text x='60' y='256' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#4b5563'>arrowhead</text><rect x='620' y='70' width='330' height='330' rx='10' fill='#ffffff' stroke='#d1d5db'/><text x='638' y='98' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15.5' font-weight='700' fill='#111827'>DLI vs DAL</text><line x1='670' y1='230' x2='900' y2='230' stroke='#111827' stroke-width='2.5'/><line x1='670' y1='222' x2='670' y2='186' stroke='#6b7280' stroke-width='1'/><line x1='900' y1='222' x2='900' y2='186' stroke='#6b7280' stroke-width='1'/><line x1='670' y1='196' x2='900' y2='196' stroke='#0891b2' stroke-width='1.2'/><path d='M670,196 L681,192.5 L681,199.5 Z' fill='#0891b2'/><path d='M900,196 L889,192.5 L889,199.5 Z' fill='#0891b2'/><text x='785' y='188' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' font-weight='700' fill='#0e7490'>DLI 2400</text><text x='638' y='256' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#6b7280'>horizontal or vertical distance</text><line x1='670' y1='370' x2='900' y2='300' stroke='#111827' stroke-width='2.5'/><line x1='664' y1='358' x2='664' y2='308' stroke='#6b7280' stroke-width='1'/><line x1='894' y1='290' x2='894' y2='240' stroke='#6b7280' stroke-width='1'/><line x1='664' y1='315' x2='894' y2='245' stroke='#0891b2' stroke-width='1.2'/><path d='M664,315 L676,313.6 L674.2,306.8 Z' fill='#0891b2'/><path d='M894,245 L882,246.4 L883.8,253.2 Z' fill='#0891b2'/><text x='800' y='262' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' font-weight='700' fill='#0e7490'>DAL 3000</text><text x='638' y='388' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#6b7280'>parallel to the two points</text><rect x='30' y='420' width='920' height='36' rx='8' fill='#ffffff' stroke='#e5e7eb'/><text x='46' y='443' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>The text is measured from the geometry — never typed — which is why dimensions follow edits.</text></svg>
