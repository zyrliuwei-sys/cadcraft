<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 394' width='980' height='394' role='img' aria-label='Clean-room rules for cloning AutoCAD. Allowed: observe AutoCAD running, use public DXF and DWG specifications, match command names, draw all assets from scratch, permissive licence. Never: read or copy the AutoCAD bundle, copy SHX fonts, hatch patterns, linetypes or templates, commit AutoCAD output, read GPL CAD code, use Autodesk artwork'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker></defs><rect width='980' height='394' fill='#f8fafc'/><text x='30' y='42' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#111827'>How you clone AutoCAD legally: the clean-room rules</text><rect x='30' y='62' width='450' height='40' rx='8' fill='#15803d'/><text x='255' y='88' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='17' font-weight='700' fill='#ffffff'>Allowed</text><rect x='30' y='112' width='450' height='40' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='46' y='138' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' font-weight='800' fill='#15803d'>✓</text><text x='70' y='137' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#1f2937'>Run AutoCAD and watch how it behaves</text><rect x='30' y='160' width='450' height='40' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='46' y='186' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' font-weight='800' fill='#15803d'>✓</text><text x='70' y='185' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#1f2937'>Use public specs: Autodesk&#x27;s DXF Reference, ODA&#x27;s DWG spec</text><rect x='30' y='208' width='450' height='40' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='46' y='234' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' font-weight='800' fill='#15803d'>✓</text><text x='70' y='233' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#1f2937'>Match command names and prompts people type</text><rect x='30' y='256' width='450' height='40' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='46' y='282' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' font-weight='800' fill='#15803d'>✓</text><text x='70' y='281' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#1f2937'>Draw every icon, font, hatch pattern and linetype from scratch</text><rect x='30' y='304' width='450' height='40' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='46' y='330' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' font-weight='800' fill='#15803d'>✓</text><text x='70' y='329' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#1f2937'>Permissive licence: MIT OR Apache-2.0</text><rect x='500' y='62' width='450' height='40' rx='8' fill='#b91c1c'/><text x='725' y='88' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='17' font-weight='700' fill='#ffffff'>Never</text><rect x='500' y='112' width='450' height='40' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='516' y='138' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' font-weight='800' fill='#b91c1c'>✕</text><text x='540' y='137' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#1f2937'>Read, disassemble or copy anything in the AutoCAD bundle</text><rect x='500' y='160' width='450' height='40' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='516' y='186' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' font-weight='800' fill='#b91c1c'>✕</text><text x='540' y='185' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#1f2937'>Copy SHX fonts, .pat, .lin, templates, CUI/PGP, help text</text><rect x='500' y='208' width='450' height='40' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='516' y='234' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' font-weight='800' fill='#b91c1c'>✕</text><text x='540' y='233' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#1f2937'>Commit files AutoCAD produced, or screenshots of it</text><rect x='500' y='256' width='450' height='40' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='516' y='282' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' font-weight='800' fill='#b91c1c'>✕</text><text x='540' y='281' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#1f2937'>Read or copy GPL CAD code (LibreCAD, QCAD, FreeCAD solver…)</text><rect x='500' y='304' width='450' height='40' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='516' y='330' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' font-weight='800' fill='#b91c1c'>✕</text><text x='540' y='329' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#1f2937'>Use Autodesk logos, icons or artwork</text><text x='30' y='374' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#4b5563'>Summarised from CADCraft&#x27;s AGENTS.md, the rules every contributor (human or AI agent) works under.</text></svg>