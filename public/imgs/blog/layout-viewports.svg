<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 530' width='980' height='530' role='img' aria-label='A paper-space layout in practice: an A3 sheet with a title block down the right edge and two dashed viewports — the large one shows the apartment plan at 1:100 with its display locked, the lower one shows the kitchen at 1:20. Side notes: both viewports show the same model at different scales; set the scale then lock the display; VP Freeze hides a layer in one viewport only'><rect width='980' height='530' fill='#f8fafc'/><text x='30' y='42' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#111827'>One sheet, two viewports, two scales</text><rect x='30' y='70' width='620' height='420' rx='2' fill='#ffffff' stroke='#111827' stroke-width='1.6'/><rect x='540' y='70' width='110' height='420' fill='#e5e7eb' opacity='0.55'/><text x='555' y='92' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' font-weight='700' fill='#9a3412'>A-101</text><rect x='555' y='102' width='80' height='7' fill='#9ca3af' opacity='0.6'/><rect x='555' y='118' width='80' height='7' fill='#9ca3af' opacity='0.6'/><rect x='555' y='142' width='80' height='10' fill='#9ca3af' opacity='0.6'/><rect x='555' y='172' width='60' height='7' fill='#9ca3af' opacity='0.6'/><text x='555' y='292' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='10' font-weight='400' fill='#4b5563'>1:100 · 1:20</text><rect x='555' y='302' width='80' height='7' fill='#9ca3af' opacity='0.6'/><rect x='555' y='318' width='80' height='7' fill='#9ca3af' opacity='0.6'/><rect x='55' y='95' width='475' height='205' fill='none' stroke='#2563eb' stroke-width='1.6' stroke-dasharray='7,5'/><path fill-rule='evenodd' fill='none' stroke='#111827' stroke-width='1.3' d='M85,265 L500,265 L500,130 L85,130 Z M91,259 L494,259 L494,136 L91,136 Z'/><line x1='300' y1='136' x2='300' y2='240' stroke='#111827' stroke-width='1'/><line x1='330' y1='259' x2='330' y2='215' stroke='#16a34a' stroke-width='1.4'/><path d='M330,215 A44,44 0 0 1 374,259' fill='none' stroke='#16a34a' stroke-width='1.2'/><text x='65' y='290' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='700' fill='#2563eb'>Plan 1:100</text><path d='M496,110 A4,4 0 0 1 504,110' fill='none' stroke='#2563eb' stroke-width='1.5'/><rect x='494' y='110' width='12' height='9' fill='none' stroke='#2563eb' stroke-width='1.5'/><rect x='55' y='320' width='475' height='150' fill='none' stroke='#16a34a' stroke-width='1.6' stroke-dasharray='7,5'/><path fill-rule='evenodd' fill='none' stroke='#111827' stroke-width='1.4' d='M100,440 L420,440 L420,345 L100,345 Z M107,433 L413,433 L413,352 L107,352 Z'/><line x1='250' y1='433' x2='250' y2='390' stroke='#16a34a' stroke-width='1.4'/><path d='M250,390 A43,43 0 0 1 293,433' fill='none' stroke='#16a34a' stroke-width='1.2'/><rect x='99' y='370' width='9' height='50' fill='#ffffff' stroke='#2563eb' stroke-width='1.2'/><text x='65' y='460' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='700' fill='#16a34a'>Kitchen detail 1:20</text><rect x='680' y='70' width='270' height='130' rx='10' fill='#ffffff' stroke='#d1d5db'/><text x='698' y='98' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15.5' font-weight='700' fill='#111827'>Same model, two views</text><text x='698' y='126' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>Both viewports look at the</text><text x='698' y='144' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>same drawing; each carries its</text><text x='698' y='162' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>own scale — 1:100 and 1:20.</text><rect x='680' y='214' width='270' height='130' rx='10' fill='#ffffff' stroke='#d1d5db'/><text x='698' y='242' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15.5' font-weight='700' fill='#111827'>Set, then lock</text><text x='698' y='270' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>Pick the scale in the viewport</text><text x='698' y='288' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>controls, then lock the display.</text><text x='698' y='306' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>Zooming inside an unlocked</text><text x='698' y='324' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>viewport silently changes it.</text><rect x='680' y='358' width='270' height='132' rx='10' fill='#ffffff' stroke='#d1d5db'/><text x='698' y='386' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15.5' font-weight='700' fill='#111827'>Freeze per viewport</text><text x='698' y='414' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>VP Freeze hides a layer in one</text><text x='698' y='432' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>viewport only — furniture out of</text><text x='698' y='450' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>the kitchen detail, for example.</text></svg>
