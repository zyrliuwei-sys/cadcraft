<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1130 400' width='1130' height='400' role='img' aria-label='Decision chart: check the DWG version code, then edit in the desktop app, convert with cadcraft-cli, or save as DXF for the online app'>
<defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker></defs>
<rect width='1130' height='400' fill='#f8fafc'/><text x='30' y='34' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#111827'>You have a .dwg file. Which route?</text><rect x='30' y='70' width='300' height='96' rx='10' fill='#ffffff' stroke='#1f2937' stroke-width='1.5'/><rect x='30' y='70' width='6' height='96' rx='3' fill='#ea580c'/><text x='48' y='98' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='17' font-weight='700' fill='#111827'>1. Check the version</text><text x='48' y='122' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#374151'>First 6 bytes, e.g. AC1032</text><text x='48' y='143' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#374151'>(macOS/Linux: head -c 6 file.dwg)</text><rect x='380' y='70' width='370' height='96' rx='10' fill='#ffffff' stroke='#1f2937' stroke-width='1.5'/><rect x='380' y='70' width='6' height='96' rx='3' fill='#16a34a'/><text x='398' y='98' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='17' font-weight='700' fill='#111827'>AC1012 – AC1032 (R13 – 2018+)</text><text x='398' y='122' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#374151'>Inside CADCraft desktop range.</text><text x='398' y='143' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#374151'>AC1032 is also what AutoCAD 2019–2027 save.</text><rect x='800' y='70' width='300' height='96' rx='10' fill='#ffffff' stroke='#1f2937' stroke-width='1.5'/><rect x='800' y='70' width='6' height='96' rx='3' fill='#dc2626'/><text x='818' y='98' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='17' font-weight='700' fill='#111827'>AC1009 or older (R12 and earlier)</text><text x='818' y='122' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#374151'>CADCraft will not open it.</text><text x='818' y='143' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#374151'>Ask for DXF, or convert first.</text><line x1='330' y1='118' x2='378' y2='118' stroke='#6b7280' stroke-width='1.8' marker-end='url(#a)'/><path d='M180 70 V58 H950 V66' fill='none' stroke='#6b7280' stroke-width='1.8' marker-end='url(#a)'/><text x='600' y='53' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#c2410c'>older code</text><text x='336' y='110' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#c2410c'>R13+</text><line x1='565' y1='166' x2='565' y2='236' stroke='#6b7280' stroke-width='1.8' marker-end='url(#a)'/><path d='M195 236 V200 H935 V236' fill='none' stroke='#6b7280' stroke-width='1.8'/><rect x='30' y='240' width='330' height='118' rx='10' fill='#ffffff' stroke='#1f2937' stroke-width='1.5'/><rect x='30' y='240' width='6' height='118' rx='3' fill='#2563eb'/><text x='48' y='268' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='17' font-weight='700' fill='#111827'>Edit it</text><text x='48' y='292' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#374151'>Desktop app → File ▸ Open…</text><text x='48' y='313' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#374151'>Keep the original; Save As a copy.</text><text x='48' y='334' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#374151'>Unsupported entities are dropped on save.</text><rect x='395' y='240' width='340' height='118' rx='10' fill='#ffffff' stroke='#1f2937' stroke-width='1.5'/><rect x='395' y='240' width='6' height='118' rx='3' fill='#2563eb'/><text x='413' y='268' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='17' font-weight='700' fill='#111827'>Just look at it / share a picture</text><text x='413' y='292' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#374151'>cadcraft-cli convert file.dwg out.png</text><text x='413' y='313' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#374151'>or out.svg — fits model-space extents.</text><text x='413' y='334' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#374151'>No GUI needed.</text><rect x='770' y='240' width='330' height='118' rx='10' fill='#ffffff' stroke='#1f2937' stroke-width='1.5'/><rect x='770' y='240' width='6' height='118' rx='3' fill='#2563eb'/><text x='788' y='268' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='17' font-weight='700' fill='#111827'>Keep working in the browser</text><text x='788' y='292' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#374151'>Desktop: Save As → DXF</text><text x='788' y='313' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#374151'>Then open the .dxf at cadcraft.org/online</text><text x='788' y='334' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#374151'>(the online app does not read DWG).</text><line x1='195' y1='200' x2='195' y2='236' stroke='#6b7280' stroke-width='1.8' marker-end='url(#a)'/><line x1='935' y1='200' x2='935' y2='236' stroke='#6b7280' stroke-width='1.8' marker-end='url(#a)'/>
<text x='1114' y='388' text-anchor='end' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#9ca3af'>cadcraft.org (independent guide)</text></svg>