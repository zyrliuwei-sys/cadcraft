<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 412' width='980' height='412' role='img' aria-label='CAD is the category of computer-aided design software; AutoCAD is one 2D drafting product in it, alongside BricsCAD, DraftSight, CADCraft, LibreCAD and QCAD. Other kinds of CAD include 3D parametric tools such as SolidWorks, Inventor, Fusion and FreeCAD, BIM tools such as Revit and ArchiCAD, and electronics, civil and code CAD'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker></defs><rect width='980' height='412' fill='#f8fafc'/><text x='30' y='42' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#111827'>CAD is the category. AutoCAD is one product in it.</text><rect x='30' y='62' width='920' height='330' rx='14' fill='#f1f5f9' stroke='#cbd5e1'/><text x='52' y='92' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' font-weight='700' fill='#334155'>CAD: computer-aided design (any software for precise drawings and models)</text><rect x='52' y='110' width='206' height='262' rx='10' fill='#fff7ed' stroke='#ea580c'/><text x='68' y='140' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' font-weight='800' fill='#9a3412'>2D drafting</text><text x='68' y='178' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='700' fill='#ea580c'>AutoCAD, AutoCAD LT</text><text x='68' y='212' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>BricsCAD, DraftSight</text><text x='68' y='246' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>CADCraft, LibreCAD, QCAD</text><rect x='276' y='110' width='206' height='262' rx='10' fill='#ffffff' stroke='#d1d5db'/><text x='292' y='140' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' font-weight='800' fill='#1f2937'>3D parametric (MCAD)</text><text x='292' y='178' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>SolidWorks, Inventor, Fusion</text><text x='292' y='212' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>CATIA, Creo, NX</text><text x='292' y='246' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>FreeCAD, Onshape</text><rect x='500' y='110' width='206' height='262' rx='10' fill='#ffffff' stroke='#d1d5db'/><text x='516' y='140' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' font-weight='800' fill='#1f2937'>BIM (buildings)</text><text x='516' y='178' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>Revit, ArchiCAD</text><text x='516' y='212' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>Vectorworks</text><text x='516' y='246' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>Bonsai, FreeCAD BIM</text><rect x='724' y='110' width='206' height='262' rx='10' fill='#ffffff' stroke='#d1d5db'/><text x='740' y='140' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' font-weight='800' fill='#1f2937'>Other kinds</text><text x='740' y='178' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>ECAD: KiCad, Altium</text><text x='740' y='212' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>Civil: Civil 3D</text><text x='740' y='246' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>Code CAD: OpenSCAD</text><text x='68' y='326' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#9a3412'>AutoCAD also does basic 3D,</text><text x='68' y='344' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#9a3412'>but 2D drafting is its core.</text></svg>