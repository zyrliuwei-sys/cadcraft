<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 430' width='980' height='430' role='img' aria-label='Attributes on an AutoCAD block: a door block whose DOOR_NO attribute appears as a tag circle reading D07; at every INSERT the command line asks Door number and Fire rating, answered here with D07 and FD60; a small schedule table lists D01 FD30 900 and D07 FD60 900 — data extraction turns block attributes into a schedule'><rect width='980' height='430' fill='#f8fafc'/><text x='30' y='42' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#111827'>Attributes: data riding on the block</text><rect x='30' y='70' width='430' height='250' rx='10' fill='#ffffff' stroke='#d1d5db'/><text x='48' y='98' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15.5' font-weight='700' fill='#111827'>A door block with a tag</text><line x1='100' y1='285' x2='300' y2='285' stroke='#111827' stroke-width='1.4'/><line x1='140' y1='285' x2='140' y2='185' stroke='#16a34a' stroke-width='1.8'/><path d='M140,185 A100,100 0 0 1 240,285' fill='none' stroke='#16a34a' stroke-width='1.2'/><circle cx='140' cy='285' r='4' fill='#dc2626'/><line x1='146' y1='235' x2='304' y2='235' stroke='#9ca3af' stroke-width='1' stroke-dasharray='4,3'/><circle cx='330' cy='235' r='24' fill='#ffffff' stroke='#9a3412' stroke-width='1.6'/><text x='330' y='240' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#9a3412'>D07</text><text x='48' y='310' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='12.5' font-weight='400' fill='#4b5563'>ATTDEF · TAG: DOOR_NO · PROMPT: Door number</text><rect x='490' y='70' width='460' height='250' rx='10' fill='#ffffff' stroke='#d1d5db'/><text x='508' y='98' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15.5' font-weight='700' fill='#111827'>Asked at every INSERT</text><text x='508' y='130' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='13' font-weight='400' fill='#4b5563'>Command: I</text><text x='508' y='154' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='13' font-weight='400' fill='#4b5563'>Insert block name: DOOR-90</text><text x='508' y='178' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='13' font-weight='400' fill='#4b5563'>Door number &lt;D01&gt;: <tspan fill='#111827' font-weight='700'>D07</tspan></text><text x='508' y='202' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='13' font-weight='400' fill='#4b5563'>Fire rating &lt;FD30&gt;: <tspan fill='#111827' font-weight='700'>FD60</tspan></text><text x='508' y='240' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#6b7280'>every reference carries its own values</text><rect x='30' y='342' width='920' height='76' rx='8' fill='#ffffff' stroke='#e5e7eb'/><text x='46' y='370' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#111827'>The payoff: schedules that stay true</text><text x='46' y='392' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>BATTMAN manages the definitions; data extraction turns</text><text x='46' y='410' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>the collected values into a door schedule.</text><text x='350' y='370' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='11' font-weight='400' fill='#6b7280'>DOOR</text><text x='430' y='370' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='11' font-weight='400' fill='#6b7280'>FIRE</text><text x='510' y='370' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='11' font-weight='400' fill='#6b7280'>WIDTH</text><line x1='340' y1='376' x2='570' y2='376' stroke='#e5e7eb'/><text x='350' y='394' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='12.5' font-weight='400' fill='#374151'>D01</text><text x='430' y='394' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='12.5' font-weight='400' fill='#374151'>FD30</text><text x='510' y='394' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='12.5' font-weight='400' fill='#374151'>900</text><text x='350' y='412' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='12.5' font-weight='400' fill='#374151'>D07</text><text x='430' y='412' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='12.5' font-weight='400' fill='#374151'>FD60</text><text x='510' y='412' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='12.5' font-weight='400' fill='#374151'>900</text></svg>
