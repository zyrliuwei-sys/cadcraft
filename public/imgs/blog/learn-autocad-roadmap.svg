<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 560' width='980' height='560' role='img' aria-label='A roadmap for learning AutoCAD in three stages: stage one, get around — LINE, RECTANG and CIRCLE, the mouse wheel for zoom and pan, coordinates, object snaps and ortho, practised by drawing shapes to exact size; stage two, draw and organize — trim, extend, offset, fillet, copy, move, rotate, mirror and array, grips and layers, practised on a floor plan; stage three, annotate and plot — text, dimensions, hatches, blocks, a layout with a 1:100 viewport and a plotted PDF, practised on an A3 sheet; a note says to read the command line, and that each stage ends with a finished drawing'><rect width='980' height='560' fill='#f8fafc'/><text x='30' y='42' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#111827'>A learning order that works</text><rect x='30' y='70' width='300' height='350' rx='10' fill='#ffffff' stroke='#d1d5db'/><text x='48' y='98' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15.5' font-weight='700' fill='#111827'>1 · Get around</text><text x='48' y='120' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#6b7280'>the first hours</text><text x='48' y='152' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='12.5' font-weight='400' fill='#4b5563'>LINE · RECTANG · CIRCLE</text><text x='48' y='178' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='12.5' font-weight='400' fill='#4b5563'>wheel: ZOOM / PAN</text><text x='48' y='204' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='12.5' font-weight='400' fill='#4b5563'>coordinates: #x,y · @dx,dy</text><text x='48' y='230' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='12.5' font-weight='400' fill='#4b5563'>polar: @2000&lt;0</text><text x='48' y='256' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='12.5' font-weight='400' fill='#4b5563'>OSNAP (F3): end, mid, int</text><text x='48' y='282' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='12.5' font-weight='400' fill='#4b5563'>ORTHO (F8)</text><rect x='48' y='352' width='264' height='44' rx='8' fill='#eff6ff' stroke='#bfdbfe'/><text x='60' y='378' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='700' fill='#1d4ed8'>Practice: exact-size shapes</text><rect x='340' y='70' width='300' height='350' rx='10' fill='#ffffff' stroke='#d1d5db'/><text x='358' y='98' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15.5' font-weight='700' fill='#111827'>2 · Draw and organize</text><text x='358' y='120' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#6b7280'>the weeks</text><text x='358' y='152' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='12.5' font-weight='400' fill='#4b5563'>TRIM · EXTEND · OFFSET</text><text x='358' y='178' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='12.5' font-weight='400' fill='#4b5563'>FILLET (r 0) · CHAMFER</text><text x='358' y='204' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='12.5' font-weight='400' fill='#4b5563'>COPY · MOVE · ROTATE</text><text x='358' y='230' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='12.5' font-weight='400' fill='#4b5563'>MIRROR · ARRAY</text><text x='358' y='256' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='12.5' font-weight='400' fill='#4b5563'>grips and selections</text><text x='358' y='282' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='12.5' font-weight='400' fill='#4b5563'>LAYERS: name, colour, plot</text><rect x='358' y='352' width='264' height='44' rx='8' fill='#f0fdf4' stroke='#bbf7d0'/><text x='370' y='378' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='700' fill='#15803d'>Practice: a floor plan</text><rect x='650' y='70' width='300' height='350' rx='10' fill='#ffffff' stroke='#d1d5db'/><text x='668' y='98' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15.5' font-weight='700' fill='#111827'>3 · Annotate and plot</text><text x='668' y='120' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#6b7280'>a weekend</text><text x='668' y='152' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='12.5' font-weight='400' fill='#4b5563'>MTEXT · DIMLINEAR</text><text x='668' y='178' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='12.5' font-weight='400' fill='#4b5563'>HATCH and its scale</text><text x='668' y='204' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='12.5' font-weight='400' fill='#4b5563'>BLOCK · INSERT</text><text x='668' y='230' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='12.5' font-weight='400' fill='#4b5563'>layout + viewport 1:100</text><text x='668' y='256' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='12.5' font-weight='400' fill='#4b5563'>PLOT to PDF at 1:1</text><rect x='668' y='352' width='264' height='44' rx='8' fill='#fff7ed' stroke='#fed7aa'/><text x='680' y='378' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='700' fill='#9a3412'>Practice: an A3 sheet</text><rect x='30' y='440' width='920' height='90' rx='8' fill='#ffffff' stroke='#e5e7eb'/><text x='46' y='470' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='700' fill='#111827'>Read the command line, not just the ribbon — every command says what it wants next.</text><text x='46' y='494' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>The order matters: precision before annotation, annotation before layouts. Each stage ends with a finished drawing.</text><text x='46' y='516' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#6b7280'>first hours → a few weeks → your first plotted sheet</text></svg>
