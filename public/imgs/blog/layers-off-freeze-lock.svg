<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 470' width='980' height='470' role='img' aria-label='Layer states compared. On: shown, plots, selectable, snaps. Off: hidden, not plotted, not selectable, can be current with a warning. Frozen: hidden, not plotted, not selectable, cannot be current, can be frozen per viewport. Locked: shown and plotted, snaps work, but cannot be edited.'><rect width='980' height='470' fill='#f8fafc'/><text x='30.0' y='42.0' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#111827'>Off vs Freeze vs Lock, at a glance</text><rect x='330' y='64' width='145' height='44' rx='8' fill='#16a34a'/><text x='402.0' y='92.0' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#ffffff'>On</text><rect x='485' y='64' width='145' height='44' rx='8' fill='#64748b'/><text x='557.0' y='92.0' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#ffffff'>Off</text><rect x='640' y='64' width='145' height='44' rx='8' fill='#2563eb'/><text x='712.0' y='92.0' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#ffffff'>Frozen</text><rect x='795' y='64' width='145' height='44' rx='8' fill='#ea580c'/><text x='867.0' y='92.0' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#ffffff'>Locked</text><rect x='30' y='118' width='910' height='46' rx='6' fill='#ffffff' stroke='#e2e8f0'/><text x='46.0' y='147.0' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='600' fill='#111827'>Shown on screen</text><text x='402.0' y='147.0' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='600' fill='#15803d'>Yes</text><text x='557.0' y='147.0' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='600' fill='#b91c1c'>No</text><text x='712.0' y='147.0' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='600' fill='#b91c1c'>No</text><text x='867.0' y='147.0' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='600' fill='#15803d'>Yes</text><rect x='30' y='170' width='910' height='46' rx='6' fill='#f1f5f9' stroke='#e2e8f0'/><text x='46.0' y='199.0' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='600' fill='#111827'>Plots</text><text x='402.0' y='199.0' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='600' fill='#15803d'>Yes*</text><text x='557.0' y='199.0' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='600' fill='#b91c1c'>No</text><text x='712.0' y='199.0' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='600' fill='#b91c1c'>No</text><text x='867.0' y='199.0' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='600' fill='#15803d'>Yes*</text><rect x='30' y='222' width='910' height='46' rx='6' fill='#ffffff' stroke='#e2e8f0'/><text x='46.0' y='251.0' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='600' fill='#111827'>Can be selected and edited</text><text x='402.0' y='251.0' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='600' fill='#15803d'>Yes</text><text x='557.0' y='251.0' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='600' fill='#b91c1c'>No</text><text x='712.0' y='251.0' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='600' fill='#b91c1c'>No</text><text x='867.0' y='251.0' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='600' fill='#b91c1c'>No</text><rect x='30' y='274' width='910' height='46' rx='6' fill='#f1f5f9' stroke='#e2e8f0'/><text x='46.0' y='303.0' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='600' fill='#111827'>Object snaps work</text><text x='402.0' y='303.0' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='600' fill='#15803d'>Yes</text><text x='557.0' y='303.0' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='600' fill='#b91c1c'>No</text><text x='712.0' y='303.0' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='600' fill='#b91c1c'>No</text><text x='867.0' y='303.0' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='600' fill='#15803d'>Yes</text><rect x='30' y='326' width='910' height='46' rx='6' fill='#ffffff' stroke='#e2e8f0'/><text x='46.0' y='355.0' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='600' fill='#111827'>Can be the current layer</text><text x='402.0' y='355.0' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='600' fill='#15803d'>Yes</text><text x='557.0' y='355.0' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='600' fill='#15803d'>Yes</text><text x='712.0' y='355.0' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='600' fill='#b91c1c'>No</text><text x='867.0' y='355.0' text-anchor='middle' font-family=