<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 470' width='980' height='470' role='img' aria-label='SCALE with the Reference option: pick the base point, pick the two ends of a length that measures 37.5, type the length it should be, 50. CADCraft and AutoCAD scale by 50 divided by 37.5, which is 1.3333.'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker><marker id='d' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,2 L10,5 L0,8 z' fill='#111827'/></marker></defs><rect width='980' height='470' fill='#f8fafc'/><text x='30' y='42' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#111827'>Scale to a known length: SCALE ▸ Reference</text><rect x='60' y='210.0' width='225.0' height='120.0' fill='#ffffff' stroke='#111827' stroke-width='2'/><circle cx='120.0' cy='270.0' r='24.0' fill='none' stroke='#111827' stroke-width='1.6'/><line x1='60' y1='364' x2='285.0' y2='364' stroke='#111827' stroke-width='1.4' marker-start='url(#d)' marker-end='url(#d)'/><text x='172.5' y='358' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#b91c1c'>37.5 (should be 50)</text><circle cx='60' cy='330' r='6' fill='#ea580c'/><text x='54' y='396' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#9a3412'>base point = first reference point</text><circle cx='285.0' cy='330' r='6' fill='#2563eb'/><text x='295.0' y='322' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#1d4ed8'>second point</text><line x1='325.0' y1='270' x2='385.0' y2='270' stroke='#6b7280' stroke-width='2' marker-end='url(#a)'/><rect x='400' y='169.9998' width='300.0' height='160.0002' fill='#ffffff' stroke='#111827' stroke-width='2'/><circle cx='479.9998' cy='250.0002' r='31.9998' fill='none' stroke='#111827' stroke-width='1.6'/><line x1='400' y1='364' x2='700.0' y2='364' stroke='#111827' stroke-width='1.4' marker-start='url(#d)' marker-end='url(#d)'/><text x='550.0' y='358' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#15803d'>50</text><rect x='750' y='70' width='205' height='360' rx='10' fill='#1f2937'/><text x='766' y='100' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='13.5' font-weight='400' fill='#fbbf24'>SC</text><text x='766' y='125' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='13.5' font-weight='400' fill='#e5e7eb'>Select: all ↵ ↵</text><text x='766' y='150' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='13.5' font-weight='400' fill='#fdba74'>Base: pick ●</text><text x='766' y='175' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='13.5' font-weight='400' fill='#9ca3af'>Factor or</text><text x='766' y='200' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='13.5' font-weight='400' fill='#9ca3af'>[Copy/Reference]:</text><text x='766' y='225' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='13.5' font-weight='400' fill='#fbbf24'>R</text><text x='766' y='250' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='13.5' font-weight='400' fill='#9ca3af'>Reference length:</text><text x='766' y='275' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='13.5' font-weight='400' fill='#93c5fd'>pick ● then ●</text><text x='766' y='300' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='13.5' font-weight='400' fill='#9ca3af'>New length:</text><text x='766' y='325' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='13.5' font-weight='400' fill='#fbbf24'>50</text><text x='766' y='375' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='13.5' font-weight='400' fill='#86efac'>factor = 50 / 37.5</text><text x='766' y='400' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='13.5' font-weight='400' fill='#86efac'>       = 1.3333</text></svg>