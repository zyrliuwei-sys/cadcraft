<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 480' width='980' height='480' role='img' aria-label='Every way to get AutoCAD: the full subscription at about two thousand US dollars a year, including 2D and 3D, all specialized toolsets and the web and mobile apps; AutoCAD LT at about a quarter of the price for 2D drafting; Flex tokens billed per day of use, cheaper below about a week a month; the education plan free for students and teachers, renewable yearly; a 30-day free trial. Outside Autodesk: CADCraft is free and open source with AutoCAD commands and DWG support, BricsCAD ZWCAD and GstarCAD sell perpetual licences, LibreCAD and QCAD are free'><rect width='980' height='480' fill='#f8fafc'/><text x='30' y='42' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#111827'>Every way to get AutoCAD</text><text x='46' y='78' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#334155'>Route</text><text x='280' y='78' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#334155'>Cost</text><text x='540' y='78' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#334155'>What you get</text><rect x='30' y='90' width='920' height='44' rx='8' fill='#ffffff' stroke='#e5e7eb'/><text x='46' y='117' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#1f2937'>AutoCAD (full)</text><text x='280' y='117' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='700' fill='#111827'>about 2,000 USD a year</text><text x='540' y='117' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>2D and 3D, all specialized toolsets, web and mobile apps</text><rect x='30' y='134' width='920' height='44' rx='8' fill='#ffffff' stroke='#e5e7eb'/><text x='46' y='161' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#1f2937'>AutoCAD LT</text><text x='280' y='161' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='700' fill='#111827'>about a quarter of that</text><text x='540' y='161' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>2D drafting only — same commands, native DWG</text><rect x='30' y='178' width='920' height='44' rx='8' fill='#ffffff' stroke='#e5e7eb'/><text x='46' y='205' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#1f2937'>Flex tokens</text><text x='280' y='205' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='700' fill='#111827'>pay per day of use</text><text x='540' y='205' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>cheaper than a seat below about a week a month</text><rect x='30' y='222' width='920' height='44' rx='8' fill='#ffffff' stroke='#e5e7eb'/><text x='46' y='249' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#1f2937'>Education plan</text><text x='280' y='249' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='700' fill='#15803d'>free</text><text x='540' y='249' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>students and teachers, renewable yearly</text><rect x='30' y='266' width='920' height='44' rx='8' fill='#ffffff' stroke='#e5e7eb'/><text x='46' y='293' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#1f2937'>30-day trial</text><text x='280' y='293' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='700' fill='#15803d'>free, once</text><text x='540' y='293' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>the full program, for evaluation</text><rect x='30' y='330' width='920' height='110' rx='8' fill='#ffffff' stroke='#e5e7eb'/><text x='46' y='358' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#9a3412'>Outside Autodesk</text><text x='46' y='384' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>CADCraft — free and open source, AutoCAD&#x27;s commands and workflow, DWG R13–2018 and DXF (pre-alpha).</text><text x='46' y='406' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>BricsCAD, ZWCAD and GstarCAD sell perpetual licences you keep. LibreCAD and QCAD are free.</text><text x='46' y='428' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#6b7280'>list prices move — treat numbers as magnitudes and check current pricing</text></svg>
