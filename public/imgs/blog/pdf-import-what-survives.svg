<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 480' width='980' height='480' role='img' aria-label='What survives a PDF import into DWG: lines, arcs and circles import cleanly; TrueType text imports as editable text; SHX text imports as line segments that AutoCAD 2024 and later can recognize; layers only if the PDF kept them; hatches become solid-filled outlines; dimensions become dead geometry with no measurement; blocks are exploded; scale is not carried; a scanned PDF yields nothing'><rect width='980' height='480' fill='#f8fafc'/><text x='30' y='42' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#111827'>What survives a PDF import</text><text x='46' y='78' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#334155'>In the PDF</text><text x='320' y='78' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#9a3412'>In the DWG after PDFIMPORT</text><rect x='30' y='90' width='920' height='40' rx='8' fill='#ffffff' stroke='#e5e7eb'/><text x='46' y='115' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#1f2937'>Lines, arcs, circles</text><text x='320' y='115' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>import cleanly as real geometry</text><rect x='30' y='130' width='920' height='40' rx='8' fill='#ffffff' stroke='#e5e7eb'/><text x='46' y='155' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#1f2937'>TrueType text</text><text x='320' y='155' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>editable text objects</text><rect x='30' y='170' width='920' height='40' rx='8' fill='#ffffff' stroke='#e5e7eb'/><text x='46' y='195' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#1f2937'>SHX text</text><text x='320' y='195' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>line segments — AutoCAD 2024 and later can recognize it back into text</text><rect x='30' y='210' width='920' height='40' rx='8' fill='#ffffff' stroke='#e5e7eb'/><text x='46' y='235' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#1f2937'>Layers</text><text x='320' y='235' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>only if the PDF kept them; usually one flat layer</text><rect x='30' y='250' width='920' height='40' rx='8' fill='#ffffff' stroke='#e5e7eb'/><text x='46' y='275' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#1f2937'>Hatches</text><text x='320' y='275' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>solid-filled outlines, not hatch objects</text><rect x='30' y='290' width='920' height='40' rx='8' fill='#ffffff' stroke='#e5e7eb'/><text x='46' y='315' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#1f2937'>Dimensions</text><text x='320' y='315' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#9a3412'>dead geometry: no measurement, no style, no link to the objects</text><rect x='30' y='330' width='920' height='40' rx='8' fill='#ffffff' stroke='#e5e7eb'/><text x='46' y='355' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#1f2937'>Blocks</text><text x='320' y='355' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>exploded into loose pieces, no definition left</text><rect x='30' y='370' width='920' height='40' rx='8' fill='#ffffff' stroke='#e5e7eb'/><text x='46' y='395' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#1f2937'>Scale</text><text x='320' y='395' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>not carried — set it by reference</text><rect x='30' y='410' width='920' height='40' rx='8' fill='#ffffff' stroke='#e5e7eb'/><text x='46' y='435' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#1f2937'>A scanned PDF</text><text x='320' y='435' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#9a3412'>nothing: pixels cannot become geometry</text></svg>
