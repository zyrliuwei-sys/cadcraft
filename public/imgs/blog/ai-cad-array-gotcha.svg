<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 372' width='980' height='372' role='img' aria-label='The same polar array run twice through MCP. With the default associative array, query_entities finds 0 circles on layer HOLES and 1 block reference. With associative false it finds 6 circles of 12 mm diameter, 57.5 from the centre. Both look identical when rendered'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker></defs><rect width='980' height='372' fill='#f8fafc'/><text x='30' y='42' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#111827'>Same picture, different objects: why the agent must query</text><rect x='30' y='66' width='450' height='46' rx='8' fill='#475569'/><text x='255' y='95' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#ffffff'>arraypolar, default (associative)</text><rect x='30' y='120' width='450' height='40' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='44' y='145' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#374151'>{handles:[h], center:[0,0], count:6}</text><text x='44' y='190' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#374151'>query_entities says:</text><rect x='30' y='202' width='450' height='34' rx='8' fill='#ffffff' stroke='#b91c1c'/><text x='44' y='224' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#b91c1c'>created: 5, handle: &quot;10B&quot;</text><rect x='30' y='244' width='450' height='34' rx='8' fill='#ffffff' stroke='#b91c1c'/><text x='44' y='266' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#b91c1c'>Circle on HOLES: 0</text><rect x='30' y='286' width='450' height='34' rx='8' fill='#ffffff' stroke='#b91c1c'/><text x='44' y='308' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#b91c1c'>Everything on HOLES: 1 Block Reference</text><rect x='500' y='66' width='450' height='46' rx='8' fill='#475569'/><text x='725' y='95' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#ffffff'>arraypolar, associative: false</text><rect x='500' y='120' width='450' height='40' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='514' y='145' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#374151'>{handles:[h], center:[0,0], count:6, associative:false}</text><text x='514' y='190' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#374151'>query_entities says:</text><rect x='500' y='202' width='450' height='34' rx='8' fill='#ffffff' stroke='#15803d'/><text x='514' y='224' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#15803d'>created: 5</text><rect x='500' y='244' width='450' height='34' rx='8' fill='#ffffff' stroke='#15803d'/><text x='514' y='266' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#15803d'>Circle on HOLES: 6</text><rect x='500' y='286' width='450' height='34' rx='8' fill='#ffffff' stroke='#15803d'/><text x='514' y='308' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#15803d'>each Ø12, 57.5 from the centre</text><text x='30' y='350' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#4b5563'>Both render as six red holes. Only the query tells you whether there are six circles to dimension, move or count.</text></svg>