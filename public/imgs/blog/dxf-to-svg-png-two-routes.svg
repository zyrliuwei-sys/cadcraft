<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 470' width='980' height='470' role='img' aria-label='Two ways to turn a DXF into SVG or PNG with CADCraft. Export (cadcraft-cli convert or File, Export): PNG is 2400 by 1600 on a dark background with layer colours and hairlines; SVG is white with colour 7 in black and every line the same width. Plot (CADCraft PNG or SVG device): white paper, a paper size and resolution, plot style tables such as monochrome.ctb, and lineweights in PNG.'><rect width='980' height='470' fill='#f8fafc'/><text x='30' y='42' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#111827'>DXF to SVG or PNG: export it, or plot it</text><rect x='230' y='64' width='350' height='74' rx='10' fill='#0891b2'/><text x='405' y='93' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='18' font-weight='700' fill='#ffffff'>Export</text><text x='405' y='120' text-anchor='middle' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='13' font-weight='400' fill='#ecfeff'>convert a.dxf a.svg  ·  File ▸ Export</text><rect x='596' y='64' width='354' height='74' rx='10' fill='#ea580c'/><text x='773' y='93' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='18' font-weight='700' fill='#ffffff'>Plot</text><text x='773' y='120' text-anchor='middle' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='13' font-weight='400' fill='#fff7ed'>plot {&quot;device&quot;:&quot;CADCraft PNG&quot;}</text><rect x='30' y='152' width='920' height='50' rx='6' fill='#ffffff' stroke='#e2e8f0'/><text x='48' y='183' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' font-weight='700' fill='#111827'>Background</text><text x='248' y='183' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='400' fill='#1f2937'>PNG dark, SVG white</text><text x='614' y='183' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='400' fill='#1f2937'>White paper</text><rect x='30' y='210' width='920' height='50' rx='6' fill='#f1f5f9' stroke='#e2e8f0'/><text x='48' y='241' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' font-weight='700' fill='#111827'>Size</text><text x='248' y='241' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='400' fill='#1f2937'>PNG 2400 × 1600 px</text><text x='614' y='241' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='400' fill='#1f2937'>Paper × dpi (A3 at 300 = 4961 × 3508)</text><rect x='30' y='268' width='920' height='50' rx='6' fill='#ffffff' stroke='#e2e8f0'/><text x='48' y='299' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' font-weight='700' fill='#111827'>Colours</text><text x='248' y='299' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='400' fill='#1f2937'>Layer colours as on screen</text><text x='614' y='299' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='400' fill='#1f2937'>Plot style table, e.g. monochrome.ctb</text><rect x='30' y='326' width='920' height='50' rx='6' fill='#f1f5f9' stroke='#e2e8f0'/><text x='48' y='357' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' font-weight='700' fill='#111827'>Line widths</text><text x='248' y='357' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='400' fill='#1f2937'>Hairlines</text><text x='614' y='357' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='400' fill='#1f2937'>PNG: lineweights · SVG: one width</text><rect x='30' y='384' width='920' height='50' rx='6' fill='#ffffff' stroke='#e2e8f0'/><text x='48' y='415' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' font-weight='700' fill='#111827'>Framing</text><text x='248' y='415' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='400' fill='#1f2937'>Extents, or --window</text><text x='614' y='415' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='400' fill='#1f2937'>Extents, or plotArea window</text><text x='30' y='462' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#374151'>Quick preview or a web image: export.  Something to print, send or put on a white page: plot.</text></svg>