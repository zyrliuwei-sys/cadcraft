<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 410' width='980' height='410' role='img' aria-label='Two kinds of online CAD. In-browser WebAssembly CAD such as CADCraft online runs on your computer: the file stays local, often no account, works offline once loaded. Cloud CAD such as Onshape or AutoCAD Web runs on vendor servers: files are uploaded, an account is always needed, no offline use, sharing by link is built in'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker></defs><rect width='980' height='410' fill='#f8fafc'/><text x='30' y='42' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#111827'>Two kinds of online CAD</text><rect x='30' y='66' width='450' height='58' rx='8' fill='#ea580c'/><text x='255' y='92' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='17' font-weight='700' fill='#ffffff'>In-browser (WebAssembly)</text><text x='255' y='112' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#f1f5f9'>The CAD program is downloaded and runs on your CPU</text><rect x='30' y='136' width='450' height='36' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='46' y='159' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#374151'>Your file</text><text x='180' y='159' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#1f2937'>stays on your computer</text><rect x='30' y='180' width='450' height='36' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='46' y='203' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#374151'>Account</text><text x='180' y='203' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#1f2937'>often none</text><rect x='30' y='224' width='450' height='36' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='46' y='247' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#374151'>Offline</text><text x='180' y='247' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#1f2937'>works once loaded</text><rect x='30' y='268' width='450' height='36' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='46' y='291' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#374151'>Big drawings</text><text x='180' y='291' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#1f2937'>limited by your device</text><rect x='30' y='312' width='450' height='36' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='46' y='335' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#374151'>Sharing</text><text x='180' y='335' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#1f2937'>send the file yourself</text><rect x='30' y='356' width='450' height='36' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='46' y='379' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#374151'>Example</text><text x='180' y='379' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#1f2937'>CADCraft online</text><rect x='500' y='66' width='450' height='58' rx='8' fill='#475569'/><text x='725' y='92' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='17' font-weight='700' fill='#ffffff'>Cloud CAD (server-side)</text><text x='725' y='112' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#f1f5f9'>Your browser shows a model that lives on the vendor&#x27;s servers</text><rect x='500' y='136' width='450' height='36' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='516' y='159' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#374151'>Your file</text><text x='650' y='159' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#1f2937'>uploaded to the vendor</text><rect x='500' y='180' width='450' height='36' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='516' y='203' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#374151'>Account</text><text x='650' y='203' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#1f2937'>always</text><rect x='500' y='224' width='450' height='36' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='516' y='247' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#374151'>Offline</text><text x='650' y='247' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#1f2937'>no</text><rect x='500' y='268' width='450' height='36' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='516' y='291' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#374151'>Big drawings</text><text x='650' y='291' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#1f2937'>server does the work</text><rect x='500' y='312' width='450' height='36' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='516' y='335' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#374151'>Sharing</text><text x='650' y='335' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#1f2937'>built in, by link</text><rect x='500' y='356' width='450' height='36' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='516' y='379' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#374151'>Examples</text><text x='650' y='379' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#1f2937'>Onshape, AutoCAD Web</text></svg>