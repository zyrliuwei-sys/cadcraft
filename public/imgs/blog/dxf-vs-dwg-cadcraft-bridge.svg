efault</text><line x1='848' y1='270' x2='782' y2='270' stroke='#6b7280' stroke-width='1.8' marker-end='url(#a)'/><text x='800' y='260' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#c2410c'>save</text><line x1='578' y1='270' x2='512' y2='270' stroke='#6b7280' stroke-width='1.8' marker-end='url(#a)'/><line x1='288' y1='270' x2='222' y2='270' stroke='#6b7280' stroke-width='1.8' marker-end='url(#a)'/><rect x='30' y='338' width='1040' height='70' rx='10' fill='#fff7ed' stroke='#fdba74'/><text x='48' y='366' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#9a3412'>Lost on the way (per the project's file-format doc, Oct 2026):</text><text x='48' y='390' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#7c2d12'>3D solids, surfaces, meshes, proxy and custom objects on DWG save · SHX font metrics · anything CADCraft doesn't model yet</text>
