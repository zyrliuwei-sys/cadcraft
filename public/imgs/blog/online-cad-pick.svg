<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 445' width='980' height='445' role='img' aria-label='Pick a free online CAD tool by job: CADCraft online for quick 2D and DXF edits without an account, Onshape Free for parametric 3D with public documents, Tinkercad for first 3D models, AutoCAD Web for DWG editing with a subscription, Autodesk Viewer to only view a DWG'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker></defs><rect width='980' height='445' fill='#f8fafc'/><text x='30' y='42' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#111827'>Free online CAD software: start from the job</text><rect x='30' y='70' width='560' height='54' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='48' y='103' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#1f2937'>Quick 2D drawing or a DXF edit, no account</text><line x1='592' y1='97' x2='640' y2='97' stroke='#6b7280' stroke-width='1.8' marker-end='url(#a)'/><rect x='644' y='70' width='306' height='54' rx='8' fill='#ea580c'/><text x='797' y='94' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#ffffff'>CADCraft online</text><text x='797' y='113' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#f1f5f9'>Free, open source, DXF</text><rect x='30' y='136' width='560' height='54' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='48' y='169' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#1f2937'>Parametric 3D parts, shared with a team</text><line x1='592' y1='163' x2='640' y2='163' stroke='#6b7280' stroke-width='1.8' marker-end='url(#a)'/><rect x='644' y='136' width='306' height='54' rx='8' fill='#475569'/><text x='797' y='160' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#ffffff'>Onshape Free</text><text x='797' y='179' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#f1f5f9'>Public documents only</text><rect x='30' y='202' width='560' height='54' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='48' y='235' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#1f2937'>First 3D models, 3D printing, classrooms</text><line x1='592' y1='229' x2='640' y2='229' stroke='#6b7280' stroke-width='1.8' marker-end='url(#a)'/><rect x='644' y='202' width='306' height='54' rx='8' fill='#475569'/><text x='797' y='226' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#ffffff'>Tinkercad</text><text x='797' y='245' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#f1f5f9'>Free, Autodesk account</text><rect x='30' y='268' width='560' height='54' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='48' y='301' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#1f2937'>Edit DWG files with real AutoCAD tools</text><line x1='592' y1='295' x2='640' y2='295' stroke='#6b7280' stroke-width='1.8' marker-end='url(#a)'/><rect x='644' y='268' width='306' height='54' rx='8' fill='#475569'/><text x='797' y='292' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#ffffff'>AutoCAD Web</text><text x='797' y='311' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#f1f5f9'>Subscription after trial</text><rect x='30' y='334' width='560' height='54'