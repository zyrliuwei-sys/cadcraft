<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 430' width='980' height='430' role='img' aria-label='A block in AutoCAD is one stored definition placed many times: a DOOR-90 block defined once with B (BLOCK), base point at the hinge, then inserted three times with INSERT at rotation 0, rotation 90 and scale 0.5. Editing the definition once with BEDIT updates every reference; copy-paste would repeat the geometry in every copy'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker></defs><rect width='980' height='430' fill='#f8fafc'/><text x='30' y='42' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#111827'>One definition, many references</text><rect x='30' y='70' width='280' height='270' rx='10' fill='#ffffff' stroke='#d1d5db'/><text x='48' y='98' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15.5' font-weight='700' fill='#111827'>Block definition</text><text x='48' y='124' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='12.5' font-weight='400' fill='#4b5563'>B (BLOCK) · Name: DOOR-90</text><text x='48' y='144' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='12.5' font-weight='400' fill='#4b5563'>Base point: the hinge</text><line x1='130' y1='290' x2='262' y2='290' stroke='#111827' stroke-width='1.4'/><line x1='160' y1='290' x2='160' y2='180' stroke='#16a34a' stroke-width='1.4'/><path d='M160,180 A95,95 0 0 1 255,290' fill='none' stroke='#16a34a' stroke-width='1.2'/><circle cx='160' cy='290' r='4' fill='#dc2626'/><text x='170' y='312' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' font-weight='400' fill='#dc2626'>base point</text><text x='48' y='334' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#6b7280'>stored once in the block table</text><line x1='310' y1='112' x2='400' y2='112' stroke='#6b7280' stroke-width='1.5' marker-end='url(#a)'/><line x1='310' y1='208' x2='400' y2='208' stroke='#6b7280' stroke-width='1.5' marker-end='url(#a)'/><line x1='310' y1='304' x2='400' y2='304' stroke='#6b7280' stroke-width='1.5' marker-end='url(#a)'/><rect x='400' y='70' width='550' height='84' rx='10' fill='#ffffff' stroke='#d1d5db'/><line x1='418' y1='134' x2='482' y2='134' stroke='#111827' stroke-width='1.2'/><line x1='430' y1='134' x2='430' y2='90' stroke='#16a34a' stroke-width='1.4'/><path d='M430,90 A44,44 0 0 1 474,134' fill='none' stroke='#16a34a' stroke-width='1.2'/><text x='500' y='104' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#111827'>Reference 1</text><text x='500' y='128' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='12.5' font-weight='400' fill='#4b5563'>INSERT · rotation 0° · scale 1</text><rect x='400' y='166' width='550' height='84' rx='10' fill='#ffffff' stroke='#d1d5db'/><line x1='430' y1='178' x2='430' y2='238' stroke='#111827' stroke-width='1.2'/><line x1='430' y1='228' x2='474' y2='228' stroke='#16a34a' stroke-width='1.4'/><path d='M474,228 A44,44 0 0 0 430,184' fill='none' stroke='#16a34a' stroke-width='1.2'/><circle cx='430' cy='228' r='3.5' fill='#dc2626'/><text x='500' y='200' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#111827'>Reference 2</text><text x='500' y='224' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='12.5' font-weight='400' fill='#4b5563'>INSERT · rotation 90°</text><rect x='400' y='262' width='550' height='84' rx='10' fill='#ffffff' stroke='#d1d5db'/><line x1='412' y1='326' x2='448' y2='326' stroke='#111827' stroke-width='1.2'/><line x1='430' y1='326' x2='430' y2='304' stroke='#16a34a' stroke-width='1.4'/><path d='M430,304 A22,22 0 0 1 452,326' fill='none' stroke='#16a34a' stroke-width='1.2'/><circle cx='430' cy='326' r='3' fill='#dc2626'/><text x='500' y='296' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#111827'>Reference 3</text><text x='500' y='320' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='12.5' font-weight='400' fill='#4b5563'>INSERT · scale 0.5</text><rect x='30' y='362' width='920' height='48' rx='8' fill='#ffffff' stroke='#e5e7eb'/><text x='46' y='384' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='700' fill='#16a34a'>Edit the definition once (BEDIT) — every reference updates.</text><text x='46' y='404' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>Copy-paste instead, and every copy carries its own geometry: that is the difference.</text></svg>
