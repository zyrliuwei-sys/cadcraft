<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 372' width='980' height='372' role='img' aria-label='Two ways to connect an AI agent: headless, where the MCP client starts cadcraft-cli mcp with an in-memory drawing and saves files; and bridged, where cadcraft-cli mcp --connect 127.0.0.1:7979 drives the CADCraft app started with --control 7979 so you can watch'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker></defs><rect width='980' height='372' fill='#f8fafc'/><text x='30' y='42' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#111827'>Two ways to connect an AI agent to CADCraft</text><text x='30' y='84' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' font-weight='700' fill='#374151'>Headless: no window, fastest, good for batch jobs</text><rect x='30' y='98' width='240' height='64' rx='8' fill='#475569'/><text x='150.0' y='127.0' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' font-weight='700' fill='#ffffff'>MCP client</text><text x='150.0' y='146.0' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#f1f5f9'>Claude Code, Claude Desktop…</text><line x1='272' y1='130' x2='330' y2='130' stroke='#6b7280' stroke-width='1.8' marker-end='url(#a)'/><rect x='334' y='98' width='280' height='64' rx='8' fill='#ea580c'/><text x='474.0' y='127.0' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' font-weight='700' fill='#ffffff'>cadcraft-cli mcp</text><text x='474.0' y='146.0' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#f1f5f9'>drawing session in memory</text><line x1='616' y1='130' x2='676' y2='130' stroke='#6b7280' stroke-width='1.8' marker-end='url(#a)'/><rect x='680' y='98' width='270' height='64' rx='8' fill='#64748b'/><text x='815.0' y='127.0' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' font-weight='700' fill='#ffffff'>Files</text><text x='815.0' y='146.0' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#f1f5f9'>DXF · DWG · PDF · SVG · PNG</text><text x='30' y='214' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' font-weight='700' fill='#374151'>Bridged: the agent drives the open app, you watch it draw</text><rect x='30' y='228' width='240' height='64' rx='8' fill='#475569'/><text x='150.0' y='257.0' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' font-weight='700' fill='#ffffff'>MCP client</text><text x='150.0' y='276.0' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#f1f5f9'>Claude Code, Claude Desktop…</text><line x1='272' y1='260' x2='330' y2='260' stroke='#6b7280' stroke-width='1.8' marker-end='url(#a)'/><rect x='334' y='228' width='280' height='64' rx='8' fill='#ea580c'/><text x='474.0' y='257.0' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' font-weight='700' fill='#ffffff'>cadcraft-cli mcp --connect</text><text x='474.0' y='276.0' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#f1f5f9'>127.0.0.1:7979</text><line x1='616' y1='260' x2='676' y2='260' stroke='#6b7280' stroke-width='1.8' marker-end='url(#a)'/><rect x='680' y='228' width='270' height='64' rx='8' fill='#c2410c'/><text x='815.0' y='257.0' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' font-weight='700' fill='#ffffff'>CADCraft app</text><text x='815.0' y='276.0' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#f1f5f9'>started with --control 7979</text><text x='30' y='330' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#4b5563'>Same 12 tools either way: command_line, script, execute, list_commands, inspect_drawing, query_entities, render, find_text,</text><text x='30' y='350' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#4b5563'>new_drawing, open, save, cancel. Bridged mode adds screenshot, ui_inspect and ui_click.</text></svg>