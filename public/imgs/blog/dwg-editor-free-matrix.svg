<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 426' width='980' height='426' role='img' aria-label='Free and open-source DWG editing compared: CADCraft opens DWG and saves 2000 to 2018; LibreCAD opens some DWG and saves DXF; QCAD Community has no DWG; FreeCAD uses an external converter; LibreDWG is a library that writes up to r2000 or r2004; ODA File Converter is free but closed source and converts DWG to and from DXF'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker></defs><rect width='980' height='426' fill='#f8fafc'/><text x='30' y='42' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#111827'>Free DWG editing: who can open and save DWG</text><text x='30' y='78' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='700' fill='#6b7280'>Tool</text><text x='210' y='78' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='700' fill='#6b7280'>Licence</text><text x='390' y='78' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='700' fill='#6b7280'>Opens DWG</text><text x='540' y='78' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='700' fill='#6b7280'>Saves DWG</text><text x='690' y='78' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='700' fill='#6b7280'>Catch</text><rect x='20' y='90' width='940' height='42' rx='8' fill='#fff7ed' stroke='#fdba74'/><text x='30' y='116' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#1f2937'>CADCraft</text><text x='210' y='116' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#1f2937'>MIT / Apache-2.0</text><text x='390' y='116' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#166534'>Yes (desktop)</text><text x='540' y='116' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#166534'>Yes, 2000–2018</text><text x='690' y='116' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#1f2937'>Lossy save; browser version is DXF only</text><rect x='20' y='140' width='940' height='42' rx='8' fill='#ffffff' stroke='#e5e7eb'/><text x='30' y='166' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#1f2937'>LibreCAD</text><text x='210' y='166' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#1f2937'>GPL</text><text x='390' y='166' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#92400e'>Partly (libdxfrw)</text><text x='540' y='166' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#991b1b'>No</text><text x='690' y='166' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#1f2937'>Saves DXF; DWG reading is basic</text><rect x='20' y='190' width='940' height='42' rx='8' fill='#ffffff' stroke='#e5e7eb'/><text x='30' y='216' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#1f2937'>QCAD Community</text><text x='210' y='216' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#1f2937'>GPL</text><text x='390' y='216' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#991b1b'>No</text><text x='540' y='216' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#991b1b'>No</text><text x='690' y='216' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#1f2937'>DWG is in paid QCAD Professional</text><rect x='20' y='240' width='940' height='42' rx='8' fill='#ffffff' stroke='#e5e7eb'/><text x='30' y='266' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#1f2937'>FreeCAD</text><text x='210' y='266' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#1f2937'>LGPL</text><text x='390' y='266' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#92400e'>Via converter</text><text x='540' y='266' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#92400e'>Via converter</text><text x='690' y='266' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#1f2937'>Uses LibreDWG, ODA File Converter or QCAD Pro</text><rect x='20' y='290' width='940' height='42' rx='8' fill='#ffffff' stroke='#e5e7eb'/><text x='30' y='316' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#1f2937'>LibreDWG</text><text x='210' y='316' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#1f2937'>GPL (library + tools)</text><text x='390' y='316' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#166534'>Yes, r13–2018</text><text x='540' y='316' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#92400e'>Up to r2000/2004</text><text x='690' y='316' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#1f2937'>Command-line tools, not an editor</text><rect x='20' y='340' width='940' height='42' rx='8' fill='#ffffff' stroke='#e5e7eb'/><text x='30' y='366' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#1f2937'>ODA File Converter</text><text x='210' y='366' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#1f2937'>Free, closed source</text><text x='390' y='366' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#166534'>Yes</text><text x='540' y='366' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#166534'>Yes, all versions</text><text x='690' y='366' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#1f2937'>Converts DWG ↔ DXF; no editing</text><text x='30' y='408' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#4b5563'>As of October 2026. Only CADCraft and LibreCAD are editors that open DWG themselves; nothing free saves DWG losslessly.</text></svg>