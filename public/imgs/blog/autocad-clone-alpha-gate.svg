<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 414' width='980' height='414' role='img' aria-label='CADCraft against AutoCAD&#x27;s five core workflows: precise drawing partial, dimensioning passes, blocks partial, layers layouts and plotting partial, lossless DWG save no. About 38 percent ready for real work'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker></defs><rect width='980' height='414' fill='#f8fafc'/><text x='30' y='42' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#111827'>How close is the clone? AutoCAD&#x27;s five core workflows</text><rect x='30' y='66' width='920' height='54' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='46' y='89' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' font-weight='700' fill='#1f2937'>Draw and modify precisely (snaps, tracking)</text><text x='46' y='109' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#4b5563'>No object snap tracking; some TRIM/EXTEND/OFFSET options stubbed</text><rect x='830' y='79' width='104' height='28' rx='14' fill='#b45309'/><text x='882' y='98' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='700' fill='#ffffff'>partial</text><rect x='30' y='128' width='920' height='54' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='46' y='151' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' font-weight='700' fill='#1f2937'>Dimension and annotate</text><text x='46' y='171' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#4b5563'>All core DIM types, associativity, TEXT/MTEXT, MLEADER, tables</text><rect x='830' y='141' width='104' height='28' rx='14' fill='#15803d'/><text x='882' y='160' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='700' fill='#ffffff'>passes</text><rect x='30' y='190' width='920' height='54' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='46' y='213' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' font-weight='700' fill='#1f2937'>Blocks: insert, edit, attributes, xrefs</text><text x='46' y='233' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#4b5563'>Block Editor works; no REFEDIT, no XCLIP; dynamic blocks lose behaviour</text><rect x='830' y='203' width='104' height='28' rx='14' fill='#b45309'/><text x='882' y='222' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='700' fill='#ffffff'>partial</text><rect x='30' y='252' width='920' height='54' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='46' y='275' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' font-weight='700' fill='#1f2937'>Layers, layouts and plotting</text><text x='46' y='295' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#4b5563'>Plot styles, Plot dialog, PUBLISH work; printers only via PDF/PNG/SVG</text><rect x='830' y='265' width='104' height='28' rx='14' fill='#b45309'/><text x='882' y='284' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='700' fill='#ffffff'>partial</text><rect x='30' y='314' width='920' height='54' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='46' y='337' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' font-weight='700' fill='#1f2937'>Save DWG AutoCAD opens without loss</text><text x='46' y='357' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#4b5563'>Drops what it doesn&#x27;t model; never checked in AutoCAD</text><rect x='830' y='327' width='104' height='28' rx='14' fill='#b91c1c'/><text x='882' y='346' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='700' fill='#ffffff'>no</text><text x='30' y='394' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#4b5563'>From the project&#x27;s own alpha gate (docs/roadmap.md, 0.14.0). Overall: about 38% ready for real work, pre-alpha.</text></svg>