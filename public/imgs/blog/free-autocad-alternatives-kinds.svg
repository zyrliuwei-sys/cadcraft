<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 430' width='980' height='430' role='img' aria-label='Four kinds of free CAD: open source (CADCraft, LibreCAD, QCAD Community, FreeCAD), free with terms (nanoCAD Free, Fusion personal use), free viewers (DWG TrueView, Autodesk Viewer) and free education licences (AutoCAD Education), each with its catch'><rect width='980' height='430' fill='#f8fafc'/><text x='30' y='42' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#111827'>“Free” means four different things</text><rect x='30' y='66' width='222' height='336' rx='10' fill='#ffffff' stroke='#d1d5db'/><rect x='30' y='66' width='222' height='46' rx='10' fill='#ea580c'/><rect x='30' y='96' width='222' height='16' fill='#ea580c'/><text x='141.0' y='95' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#ffffff'>Open source</text><text x='48' y='142' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='600' fill='#111827'>• CADCraft</text><text x='48' y='168' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='600' fill='#111827'>• LibreCAD</text><text x='48' y='194' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='600' fill='#111827'>• QCAD Community</text><text x='48' y='220' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='600' fill='#111827'>• FreeCAD</text><line x1='48' y1='262' x2='234' y2='262' stroke='#e5e7eb'/><text x='48' y='290' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>Free for any use,</text><text x='48' y='312' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>commercial too.</text><text x='48' y='334' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>Catch: DWG fidelity,</text><text x='48' y='356' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>no vendor support.</text><rect x='266' y='66' width='222' height='336' rx='10' fill='#ffffff' stroke='#d1d5db'/><rect x='266' y='66' width='222' height='46' rx='10' fill='#0891b2'/><rect x='266' y='96' width='222' height='16' fill='#0891b2'/><text x='377.0' y='95' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#ffffff'>Free with terms</text><text x='284' y='142' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='600' fill='#111827'>• nanoCAD Free (v5)</text><text x='284' y='168' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='600' fill='#111827'>• Fusion personal use</text><line x1='284' y1='262' x2='470' y2='262' stroke='#e5e7eb'/><text x='284' y='290' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>Registration, renewals,</text><text x='284' y='312' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>non-commercial only.</text><text x='284' y='334' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>Catch: old DWG or</text><text x='284' y='356' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>limited exports.</text><rect x='502' y='66' width='222' height='336' rx='10' fill='#ffffff' stroke='#d1d5db'/><rect x='502' y='66' width='222' height='46' rx='10' fill='#475569'/><rect x='502' y='96' width='222' height='16' fill='#475569'/><text x='613.0' y='95' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#ffffff'>Free viewer</text><text x='520' y='142' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='600' fill='#111827'>• DWG TrueView</text><text x='520' y='168' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='600' fill='#111827'>• Autodesk Viewer</text><line x1='520' y1='262' x2='706' y2='262' stroke='#e5e7eb'/><text x='520' y='290' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>Open, measure, plot,</text><text x='520' y='312' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>convert versions.</text><text x='520' y='334' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>Catch: you can&#x27;t</text><text x='520' y='356' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>change the drawing.</text><rect x='738' y='66' width='222' height='336' rx='10' fill='#ffffff' stroke='#d1d5db'/><rect x='738' y='66' width='222' height='46' rx='10' fill='#7c3aed'/><rect x='738' y='96' width='222' height='16' fill='#7c3aed'/><text x='849.0' y='95' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#ffffff'>Free for education</text><text x='756' y='142' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='600' fill='#111827'>• AutoCAD Education</text><line x1='756' y1='262' x2='942' y2='262' stroke='#e5e7eb'/><text x='756' y='290' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>Full AutoCAD for</text><text x='756' y='312' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>eligible students</text><text x='756' y='334' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>and educators.</text><text x='756' y='356' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>Catch: no paid work.</text></svg>