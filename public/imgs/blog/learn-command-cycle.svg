<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 450' width='980' height='450' role='img' aria-label='The AutoCAD command line as a conversation: Command L starts LINE, it asks for the first point, you answer with a click, then @2000&lt;0 for a polar coordinate, and the prompt offers [Undo] then [Close/Undo]; typing C closes the shape. Callouts: type the command or alias and press Enter; the prompt states what it wants; bracketed options are chosen by their capital letter; Enter repeats and Esc cancels'><rect width='980' height='450' fill='#f8fafc'/><text x='30' y='42' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#111827'>Every command is the same conversation</text><rect x='30' y='70' width='470' height='300' rx='10' fill='#ffffff' stroke='#d1d5db'/><text x='48' y='98' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15.5' font-weight='700' fill='#111827'>The LINE command, as it happens</text><text x='48' y='132' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='13' font-weight='700' fill='#111827'>Command: L</text><text x='48' y='158' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='13' font-weight='400' fill='#4b5563'>LINE  Specify first point: (click)</text><text x='48' y='184' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='13' font-weight='400' fill='#4b5563'>Specify next point or <tspan fill='#9a3412' font-weight='700'>[Undo]</tspan>: @2000&lt;0</text><text x='48' y='210' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='13' font-weight='400' fill='#4b5563'>Specify next point or <tspan fill='#9a3412' font-weight='700'>[Undo]</tspan>: (click)</text><text x='48' y='236' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='13' font-weight='400' fill='#4b5563'>Specify next point or <tspan fill='#9a3412' font-weight='700'>[Close/Undo]</tspan>: C</text><text x='48' y='262' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='13' font-weight='700' fill='#111827'>Command:</text><rect x='120' y='252' width='8' height='12' fill='#111827'/><line x1='48' y1='330' x2='150' y2='330' stroke='#0891b2' stroke-width='1.4'/><line x1='150' y1='330' x2='90' y2='238' stroke='#0891b2' stroke-width='1.4'/><line x1='48' y1='330' x2='90' y2='238' stroke='#0891b2' stroke-width='1.4'/><text x='166' y='334' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#6b7280'>C closes back to the first point</text><rect x='530' y='70' width='420' height='300' rx='10' fill='#ffffff' stroke='#d1d5db'/><text x='548' y='98' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15.5' font-weight='700' fill='#111827'>How to read it</text><rect x='548' y='120' width='8' height='8' fill='#16a34a'/><text x='566' y='130' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>Type the name or its alias — then press Enter.</text><rect x='548' y='166' width='8' height='8' fill='#16a34a'/><text x='566' y='176' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>The prompt says what it wants next.</text><rect x='548' y='212' width='8' height='8' fill='#16a34a'/><text x='566' y='222' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>[Options]: type the capital letter — C.</text><rect x='548' y='258' width='8' height='8' fill='#16a34a'/><text x='566' y='268' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>Enter repeats · Esc cancels.</text><text x='566' y='310' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#6b7280'>The options change per command and per step —</text><text x='566' y='328' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#6b7280'>read the brackets before you click.</text><rect x='30' y='392' width='920' height='42' rx='8' fill='#ffffff' stroke='#e5e7eb'/><text x='46' y='418' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='700' fill='#111827'>Same loop, every program:</text><text x='226' y='418' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>BricsCAD, DraftSight and CADCraft all work this way — learn it once.</text></svg>
