<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 372' width='980' height='372' role='img' aria-label='Four ways to use AI for CAD for free: AutoCAD&#x27;s built-in AI needs a subscription and its agent mode is a Windows tech preview; a chat model can write a script you run; an AI agent can drive CADCraft over MCP; text-to-CAD generators make 3D parts'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker></defs><rect width='980' height='372' fill='#f8fafc'/><text x='30' y='42' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#111827'>&quot;AutoCAD AI&quot; for free: four routes</text><rect x='30' y='66' width='330' height='62' rx='8' fill='#475569'/><text x='48' y='93' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#ffffff'>AutoCAD&#x27;s built-in AI</text><text x='48' y='114' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#e2e8f0'>Smart Blocks, Markup Assist, Autodesk Assistant</text><line x1='362' y1='97' x2='404' y2='97' stroke='#6b7280' stroke-width='1.8' marker-end='url(#a)'/><rect x='408' y='66' width='542' height='62' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='426' y='103' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='500' fill='#1f2937'>Needs an AutoCAD subscription; agent mode is a Windows tech preview</text><rect x='30' y='140' width='330' height='62' rx='8' fill='#475569'/><text x='48' y='167' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#ffffff'>A chat model writes a script</text><text x='48' y='188' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#e2e8f0'>ChatGPT, Claude, Gemini free tiers</text><line x1='362' y1='171' x2='404' y2='171' stroke='#6b7280' stroke-width='1.8' marker-end='url(#a)'/><rect x='408' y='140' width='542' height='62' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='426' y='177' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='500' fill='#1f2937'>Free; you paste a .scr or LISP file and check it</text><rect x='30' y='214' width='330' height='62' rx='8' fill='#ea580c'/><text x='48' y='241' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#ffffff'>An AI agent drives the CAD app</text><text x='48' y='262' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#e2e8f0'>CADCraft + MCP (Claude, other clients)</text><line x1='362' y1='245' x2='404' y2='245' stroke='#6b7280' stroke-width='1.8' marker-end='url(#a)'/><rect x='408' y='214' width='542' height='62' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='426' y='251' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='500' fill='#1f2937'>Free and open source; the agent draws, checks and renders</text><rect x='30' y='288' width='330' height='62' rx='8' fill='#475569'/><text x='48' y='315' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#ffffff'>Text-to-CAD generators</text><text x='48' y='336' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#e2e8f0'>Prompt to 3D part (STEP, STL)</text><line x1='362' y1='319' x2='404' y2='319' stroke='#6b7280' stroke-width='1.8' marker-end='url(#a)'/><rect x='408' y='288' width='542' height='62' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='426' y='325' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='500' fill='#1f2937'>Free tiers vary; mostly 3D parts, not 2D drawings</text></svg>