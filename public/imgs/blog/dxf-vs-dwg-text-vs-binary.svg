<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1100 430' width='1100' height='430' role='img' aria-label='Left: the first lines of an ASCII DXF file showing group codes and values. Right: a DWG file is binary except its six-byte version code such as AC1032'>
<defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker></defs>
<rect width='1100' height='430' fill='#f8fafc'/><text x='30' y='42' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#111827'>Same drawing idea, two encodings</text><rect x='30' y='66' width='500' height='330' rx='10' fill='#ffffff' stroke='#1f2937' stroke-width='1.5'/><text x='48' y='94' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='17' font-weight='700' fill='#111827'>apartment.dxf — open in any text editor</text><text x='60' y='124' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='14' fill='#2563eb' xml:space='preserve'>  0</text><text x='60' y='144' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='14' fill='#111827' xml:space='preserve'>SECTION</text><text x='60' y='164' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='14' fill='#2563eb' xml:space='preserve'>  2</text><text x='60' y='184' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='14' fill='#111827' xml:space='preserve'>HEADER</text><text x='60' y='204' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='14' fill='#2563eb' xml:space='preserve'>  9</text><text x='60' y='224' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='14' fill='#111827' xml:space='preserve'>$ACADVER</text><text x='60' y='244' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='14' fill='#2563eb' xml:space='preserve'>  1</text><text x='60' y='264' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='14' fill='#111827' xml:space='preserve'>AC1015</text><text x='60' y='284' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='14' fill='#2563eb' xml:space='preserve'>  9</text><text x='60' y='304' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='14' fill='#111827' xml:space='preserve'>$EXTMIN</text><text x='60' y='324' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='14' fill='#2563eb' xml:space='preserve'> 10</text><text x='60' y='344' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='14' fill='#111827' xml:space='preserve'>-1150.0</text><text x='250' y='124' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#6b7280'>blue = group code</text><text x='250' y='144' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#6b7280'>black = value</text><text x='250' y='264' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#6b7280'>AC1015 = DXF written as R2000</text><rect x='570' y='66' width='500' height='330' rx='10' fill='#ffffff' stroke='#1f2937' stroke-width='1.5'/><text x='588' y='94' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='17' font-weight='700' fill='#111827'>drawing.dwg — first bytes as hex</text><text x='600' y='130' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='15' fill='#111827'>41 43 31 30 33 32</text><text x='790' y='130' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#6b7280'>A C 1 0 3 2  ← readable version code</text><text x='600' y='158' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='15' fill='#111827'>?? ?? ?? ?? ?? ??</text><text x='790' y='158' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#6b7280'>compressed, binary sections</text><text x='600' y='186' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='15' fill='#111827'>?? ?? ?? ?? ?? ??</text><text x='790' y='186' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#6b7280'>not meant to be read by people</text><text x='600' y='214' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='15' fill='#111827'>?? ?? ?? ?? ?? ??</text><text x='790' y='214' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#6b7280'></text><text x='600' y='280' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#374151'>Only the first 6 bytes are plain text.</text><text x='600' y='302' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#374151'>Everything after needs a DWG library to decode</text><text x='600' y='324' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#374151'>(CADCraft uses the open-source acadrust crate).</text>
<text x='1084' y='418' text-anchor='end' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#9ca3af'>cadcraft.org (independent guide)</text></svg>