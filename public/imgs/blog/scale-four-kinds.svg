<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 340' width='980' height='340' role='img' aria-label='Four different scales in AutoCAD and CADCraft. SCALE changes the real size of objects. Viewport scale sets how big model space looks on a layout sheet. Annotation scale and DIMSCALE size text, arrows and hatches for that scale. Plot scale maps a drawing to paper.'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker><marker id='d' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,2 L10,5 L0,8 z' fill='#111827'/></marker></defs><rect width='980' height='340' fill='#f8fafc'/><text x='30' y='42' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#111827'>Four things called “scale”: only one changes your geometry</text><rect x='30' y='66' width='222' height='240' rx='10' fill='#ffffff' stroke='#d1d5db'/><rect x='30' y='66' width='222' height='46' rx='10' fill='#ea580c'/><rect x='30' y='96' width='222' height='16' fill='#ea580c'/><text x='141.0' y='95' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#ffffff'>SCALE (SC)</text><text x='48' y='142' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' font-weight='700' fill='#6b7280'>Changes</text><text x='48' y='164' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='600' fill='#111827'>Real size of objects</text><line x1='48' y1='186' x2='234' y2='186' stroke='#e5e7eb'/><text x='48' y='212' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' font-weight='700' fill='#6b7280'>Use it when</text><text x='48' y='236' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#374151'>The geometry is wrong:</text><text x='48' y='258' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#374151'>wrong units, a traced</text><text x='48' y='280' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#374151'>image, a bad import</text><rect x='266' y='66' width='222' height='240' rx='10' fill='#ffffff' stroke='#d1d5db'/><rect x='266' y='66' width='222' height='46' rx='10' fill='#2563eb'/><rect x='266' y='96' width='222' height='16' fill='#2563eb'/><text x='377.0' y='95' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#ffffff'>Viewport scale</text><text x='284' y='142' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' font-weight='700' fill='#6b7280'>Changes</text><text x='284' y='164' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='600' fill='#111827'>Model space on a sheet</text><line x1='284' y1='186' x2='470' y2='186' stroke='#e5e7eb'/><text x='284' y='212' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' font-weight='700' fill='#6b7280'>Use it when</text><text x='284' y='236' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#374151'>Draw 1:1 in model space,</text><text x='284' y='258' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#374151'>show it at 1:50 in a</text><text x='284' y='280' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#374151'>layout viewport</text><rect x='502' y='66' width='222' height='240' rx='10' fill='#ffffff' stroke='#d1d5db'/><rect x='502' y='66' width='222' height='46' rx='10' fill='#7c3aed'/><rect x='502' y='96' width='222' height='16' fill='#7c3aed'/><text x='613.0' y='95' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#ffffff'>Annotation scale</text><text x='520' y='142' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' font-weight='700' fill='#6b7280'>Changes</text><text x='520' y='164' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='600' fill='#111827'>Text, arrows, hatches</text><line x1='520' y1='186' x2='706' y2='186' stroke='#e5e7eb'/><text x='520' y='212' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' font-weight='700' fill='#6b7280'>Use it when</text><text x='520' y='236' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#374151'>Notes and dimensions</text><text x='520' y='258' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#374151'>read the same size on</text><text x='520' y='280' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#374151'>paper at any scale</text><rect x='738' y='66' width='222' height='240' rx='10' fill='#ffffff' stroke='#d1d5db'/><rect x='738' y='66' width='222' height='46' rx='10' fill='#0891b2'/><rect x='738' y='96' width='222' height='16' fill='#0891b2'/><text x='849.0' y='95' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#ffffff'>Plot scale</text><text x='756' y='142' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' font-weight='700' fill='#6b7280'>Changes</text><text x='756' y='164' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='600' fill='#111827'>Drawing to paper</text><line x1='756' y1='186' x2='942' y2='186' stroke='#e5e7eb'/><text x='756' y='212' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' font-weight='700' fill='#6b7280'>Use it when</text><text x='756' y='236' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#374151'>Printing model space</text><text x='756' y='258' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#374151'>directly, or a layout</text><text x='756' y='280' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#374151'>at 1:1</text><text x='30' y='330' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='600' fill='#374151'>Rule of thumb: draw at 1:1 in real units, then scale the view, never the geometry, to fit a sheet.</text></svg>