<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1130 460' width='1130' height='460' role='img' aria-label='Decision chart: AutoCAD 2018 or later gets DXF 2018, unknown recipients 2013 or 2010, old software 2004 or 2000, and R12-only CNC tools need another converter'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker></defs><rect width='1130' height='460' fill='#f8fafc'/><text x='30' y='36' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#111827'>Which DXF version should the conversion write?</text><rect x='30' y='70' width='300' height='110' rx='10' fill='#ffffff' stroke='#1f2937' stroke-width='1.5'/><rect x='30' y='70' width='6' height='110' rx='3' fill='#6b7280'/><text x='48' y='98' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='17' font-weight='700' fill='#111827'>Who opens the DXF?</text><text x='48' y='122' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#374151'>Ask before you convert.</text><text x='48' y='143' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#374151'>CADCraft writes 2000–2018,</text><text x='48' y='164' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#374151'>ASCII or binary.</text><line x1='330' y1='125' x2='400' y2='100' stroke='#6b7280' stroke-width='2' marker-end='url(#a)'/><rect x='405' y='60' width='700' height='86' rx='10' fill='#ffffff' stroke='#1f2937' stroke-width='1.5'/><rect x='405' y='60' width='6' height='86' rx='3' fill='#16a34a'/><text x='423' y='88' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='17' font-weight='700' fill='#111827'>AutoCAD 2018+ or a current tool</text><text x='423' y='112' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#374151'>→ 2018 (AC1032)</text><text x='423' y='133' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#374151'>Current format, CADCraft’s default</text><line x1='330' y1='125' x2='400' y2='196' stroke='#6b7280' stroke-width='2' marker-end='url(#a)'/><rect x='405' y='156' width='700' height='86' rx='10' fill='#ffffff' stroke='#1f2937' stroke-width='1.5'/><rect x='405' y='156' width='6' height='86' rx='3' fill='#2563eb'/><text x='423' y='184' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='17' font-weight='700' fill='#111827'>Unknown, or a few years old</text><text x='423' y='208' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#374151'>→ 2013 (AC1027) or 2010 (AC1024)</text><text x='423' y='229' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#374151'>Widely read; UTF-8 text</text><line x1='330' y1='125' x2='400' y2='292' stroke='#6b7280' stroke-width='2' marker-end='url(#a)'/><rect x='405' y='252' width='700' height='86' rx='10' fill='#ffffff' stroke='#1f2937' stroke-width='1.5'/><rect x='405' y='252' width='6' height='86' rx='3' fill='#ea580c'/><text x='423' y='280' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='17' font-weight='700' fill='#111827'>Old software that refuses newer</text><text x='423' y='304' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#374151'>→ 2004 (AC1018) or 2000 (AC1015)</text><text x='423' y='325' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#374151'>Oldest CADCraft can write</text><line x1='330' y1='125' x2='400' y2='388' stroke='#6b7280' stroke-width='2' marker-end='url(#a)'/><rect x='405' y='348' width='700' height='86' rx='10' fill='#ffffff' stroke='#1f2937' stroke-width='1.5'/><rect x='405' y='348' width='6' height='86' rx='3' fill='#dc2626'/><text x='423' y='376' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='17' font-weight='700' fill='#111827'>CNC/laser tool wants R12</text><text x='423' y='400' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#374151'>→ Not CADCraft</text><text x='423' y='421' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#374151'>It can’t write R12 (AC1009)</text></svg>