<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 470' width='980' height='470' role='img' aria-label='Two ways to size dimension text: manually with DIMSCALE, where 2.5 mm paper text becomes 250 in a 1:100 millimetre model and 125 at 1:50, one style per scale; or one annotative style that adapts to each viewport scale so the text prints 2.5 mm everywhere, shown as two viewports at 1:100 and 1:20 with the same visual text size. Start from the paper size and let the setting multiply'><rect width='980' height='470' fill='#f8fafc'/><text x='30' y='42' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#111827'>Sizing text: two ways</text><rect x='30' y='70' width='460' height='330' rx='10' fill='#ffffff' stroke='#d1d5db'/><text x='48' y='98' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15.5' font-weight='700' fill='#1d4ed8'>Manual: DIMSCALE</text><text x='48' y='126' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='12.5' font-weight='400' fill='#4b5563'>text 2.5 mm on paper</text><text x='48' y='146' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='12.5' font-weight='400' fill='#4b5563'>1:100 model → height 250</text><text x='48' y='166' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='12.5' font-weight='400' fill='#4b5563'>1:50 model → height 125</text><text x='48' y='196' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>One style per scale —</text><text x='48' y='216' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>A-DIM-100, A-DIM-50 —</text><text x='48' y='236' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>and the arithmetic is yours.</text><line x1='60' y1='330' x2='300' y2='330' stroke='#111827' stroke-width='3'/><line x1='70' y1='322' x2='70' y2='282' stroke='#6b7280' stroke-width='1'/><line x1='290' y1='322' x2='290' y2='282' stroke='#6b7280' stroke-width='1'/><line x1='70' y1='292' x2='290' y2='292' stroke='#0891b2' stroke-width='1.2'/><path d='M70,292 L81,288.5 L81,295.5 Z' fill='#0891b2'/><path d='M290,292 L279,288.5 L279,295.5 Z' fill='#0891b2'/><text x='180' y='284' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' font-weight='700' fill='#0e7490'>2400</text><text x='48' y='368' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#6b7280'>style carries the multiply factor</text><rect x='510' y='70' width='440' height='330' rx='10' fill='#ffffff' stroke='#d1d5db'/><text x='528' y='98' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15.5' font-weight='700' fill='#15803d'>Annotative: set once</text><text x='528' y='126' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>One style, flagged annotative.</text><text x='528' y='146' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>Each viewport scale gets the right</text><text x='528' y='166' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>size automatically — 2.5 mm printed.</text><rect x='528' y='188' width='186' height='116' rx='4' fill='none' stroke='#2563eb' stroke-width='1.4' stroke-dasharray='6,4'/><line x1='546' y1='276' x2='696' y2='276' stroke='#111827' stroke-width='2'/><line x1='580' y1='268' x2='580' y2='236' stroke='#6b7280' stroke-width='1'/><line x1='660' y1='268' x2='660' y2='236' stroke='#6b7280' stroke-width='1'/><line x1='580' y1='244' x2='660' y2='244' stroke='#0891b2' stroke-width='1.2'/><path d='M580,244 L589,241 L589,247 Z' fill='#0891b2'/><path d='M660,244 L651,241 L651,247 Z' fill='#0891b2'/><text x='620' y='236' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' font-weight='700' fill='#0e7490'>2400</text><text x='546' y='220' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' font-weight='700' fill='#2563eb'>viewport 1:100</text><rect x='740' y='188' width='186' height='116' rx='4' fill='none' stroke='#16a34a' stroke-width='1.4' stroke-dasharray='6,4'/><line x1='758' y1='276' x2='908' y2='276' stroke='#111827' stroke-width='2'/><line x1='790' y1='268' x2='790' y2='236' stroke='#6b7280' stroke-width='1'/><line x1='872' y1='268' x2='872' y2='236' stroke='#6b7280' stroke-width='1'/><line x1='790' y1='244' x2='872' y2='244' stroke='#0891b2' stroke-width='1.2'/><path d='M790,244 L799,241 L799,247 Z' fill='#0891b2'/><path d='M872,244 L863,241 L863,247 Z' fill='#0891b2'/><text x='831' y='236' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' font-weight='700' fill='#0e7490'>480</text><text x='758' y='220' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' font-weight='700' fill='#16a34a'>viewport 1:20</text><text x='528' y='342' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#6b7280'>same style, both print text at 2.5 mm</text><rect x='30' y='420' width='920' height='36' rx='8' fill='#ffffff' stroke='#e5e7eb'/><text x='46' y='443' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>Either way, start from paper size: pick the printed text height (2.5 mm is typical), then let the setting do the multiplying.</text></svg>
