<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 460' width='980' height='460' role='img' aria-label='A portable CADCraft folder on a USB drive: cadcraft.exe and cadcraft-cli.exe from the portable ZIP, licence files, a CADCraft.bat launcher you add that sets CADCRAFT_CONFIG_DIR to a config folder next to it, and a drawings folder'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker></defs><rect width='980' height='460' fill='#f8fafc'/><text x='30' y='42' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#111827'>A truly portable CADCraft folder</text><rect x='30' y='62' width='520' height='300' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='52' y='96' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' font-weight='700' fill='#111827'>E:\CADCraft\</text><text x='80' y='134' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#1f2937'>└ cadcraft.exe</text><line x1='560' y1='129' x2='600' y2='129' stroke='#6b7280' stroke-width='1.8' marker-end='url(#a)'/><text x='610' y='134' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>from cadcraft-&lt;ver&gt;-windows-x64-portable.zip</text><text x='80' y='172' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#1f2937'>└ cadcraft-cli.exe</text><line x1='560' y1='167' x2='600' y2='167' stroke='#6b7280' stroke-width='1.8' marker-end='url(#a)'/><text x='610' y='172' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>command line, MCP server</text><text x='80' y='210' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#6b7280'>└ LICENSE-*.txt, NOTICE…</text><line x1='560' y1='205' x2='600' y2='205' stroke='#6b7280' stroke-width='1.8' marker-end='url(#a)'/><text x='610' y='210' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>licence files from the ZIP</text><text x='80' y='248' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' font-weight='700' fill='#ea580c'>└ CADCraft.bat</text><line x1='560' y1='243' x2='600' y2='243' stroke='#6b7280' stroke-width='1.8' marker-end='url(#a)'/><text x='610' y='248' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>you add this: sets CADCRAFT_CONFIG_DIR</text><text x='80' y='286' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' font-weight='700' fill='#ea580c'>└ config\</text><line x1='560' y1='281' x2='600' y2='281' stroke='#6b7280' stroke-width='1.8' marker-end='url(#a)'/><text x='610' y='286' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>settings, recent files, logs land here</text><text x='80' y='324' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' font-weight='700' fill='#1f2937'>└ drawings\</text><line x1='560' y1='319' x2='600' y2='319' stroke='#6b7280' stroke-width='1.8' marker-end='url(#a)'/><text x='610' y='324' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>your DXF / DWG files</text><rect x='30' y='380' width='920' height='58' rx='8' fill='#1f2937'/><text x='48' y='404' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#e5e7eb'>@echo off</text><text x='48' y='426' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#fdba74'>set &quot;CADCRAFT_CONFIG_DIR=%~dp0config&quot; &amp; start &quot;&quot; &quot;%~dp0cadcraft.exe&quot; %*</text></svg>