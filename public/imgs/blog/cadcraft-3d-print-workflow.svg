<rect width="960" height="418" fill="#f8fafb"/><g font-family="IBM Plex Sans,Segoe UI,Arial,sans-serif"><text x="32" y="43" font-size="28" fill="#17252e" font-weight="700" text-anchor="start">From a CAD profile to a 3D print</text><text x="32" y="73" font-size="17" fill="#596a76" font-weight="400" text-anchor="start">Each handoff has a separate check.</text><rect x="32" y="116" width="210" height="214" rx="8" fill="white" stroke="#cbd5da"/><text x="49" y="154" font-size="27" fill="#c85e24" font-weight="700" text-anchor="start">01</text><text x="49" y="194" font-size="21" fill="#17252e" font-weight="700" text-anchor="start">Closed profile</text><text x="49" y="223" font-size="17" fill="#24617a" font-weight="600" text-anchor="start">CADCraft</text><text x="49" y="268" font-size="15" fill="#596a76" font-weight="400" text-anchor="start">Check units, joins and</text><text x="49" y="291" font-size="15" fill="#596a76" font-weight="400" text-anchor="start">holes</text><path d="M246 222 L261 222" stroke="#596a76" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="266" y="116" width="210" height="214" rx="8" fill="white" stroke="#cbd5da"/><text x="283" y="154" font-size="27" fill="#c85e24" font-weight="700" text-anchor="start">02</text><text x="283" y="194" font-size="21" fill="#17252e" font-weight="700" text-anchor="start">Add thickness</text><text x="283" y="223" font-size="17" fill="#24617a" font-weight="600" text-anchor="start">3D modeler</text><text x="283" y="268" font-size="15" fill="#596a76" font-weight="400" text-anchor="start">Create and validate a</text><text x="283" y="291" font-size="15" fill="#596a76" font-weight="400" text-anchor="start">volume</text><path d="M480 222 L495 222" stroke="#596a76" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="500" y="116" width="210" height="214" rx="8" fill="white" stroke="#cbd5da"/><text x="517" y="154" font-size="27" fill="#c85e24" font-weight="700" text-anchor="start">03</text><text x="517" y="194" font-size="21" fill="#17252e" font-weight="700" text-anchor="start">Export a mesh</text><text x="517" y="223" font-size="17" fill="#24617a" font-weight="600" text-anchor="start">STL / supported mesh</text><text x="517" y="268" font-size="15" fill="#596a76" font-weight="400" text-anchor="start">Keep the editable CAD</text><text x="517" y="291" font-size="15" fill="#596a76" font-weight="400" text-anchor="start">project</text><path d="M714 222 L729 222" stroke="#596a76" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="734" y="116" width="210" height="214" rx="8" fill="white" stroke="#cbd5da"/><text x="751" y="154" font-size="27" fill="#c85e24" font-weight="700" text-anchor="start">04</text><text x="751" y="194" font-size="21" fill="#17252e" font-weight="700" text-anchor="start">Slice + inspect</text><text x="751" y="223" font-size="17" fill="#24617a" font-weight="600" text-anchor="start">Slicer</text><text x="751" y="268" font-size="15" fill="#596a76" font-weight="400" text-anchor="start">Check size and layer</text><text x="751" y="291" font-size="15" fill="#596a76" font-weight="400" text-anchor="start">preview</text><text x="32" y="378" font-size="18" fill="#596a76" font-weight="400" text-anchor="start">Renaming .dxf to .stl does not create a model or perform a conversion.</text>
