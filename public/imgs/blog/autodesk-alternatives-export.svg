<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 380' width='980' height='380' role='img' aria-label='Export Autodesk files to open formats before switching: AutoCAD DWG to DXF, Revit RVT to IFC, Fusion and Inventor parts to STEP, 3ds Max and Maya scenes to FBX, OBJ or glTF, EAGLE boards opened directly by KiCad, with what survives in each case'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker></defs><rect width='980' height='380' fill='#f8fafc'/><text x='30' y='42' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#111827'>Before you switch: export to an open format</text><text x='30' y='76' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='700' fill='#6b7280'>From</text><text x='330' y='76' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='700' fill='#6b7280'>Export as</text><text x='560' y='76' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='700' fill='#6b7280'>What survives</text><rect x='30' y='88' width='920' height='48' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='46' y='109' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' font-weight='700' fill='#1f2937'>AutoCAD drawing</text><text x='46' y='127' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#6b7280'>.dwg</text><rect x='330' y='97' width='210' height='30' rx='6' fill='#ea580c'/><text x='435' y='117' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='700' fill='#ffffff'>DXF (2018 or 2013)</text><text x='560' y='117' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>Keeps layers, blocks, dims; custom objects may flatten</text><rect x='30' y='144' width='920' height='48' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='46' y='165' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' font-weight='700' fill='#1f2937'>Revit model</text><text x='46' y='183' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#6b7280'>.rvt</text><rect x='330' y='153' width='210' height='30' rx='6' fill='#ea580c'/><text x='435' y='173' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='700' fill='#ffffff'>IFC 4 (or IFC2x3)</text><text x='560' y='173' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>Geometry and properties; families stop being editable</text><rect x='30' y='200' width='920' height='48' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='46' y='221' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' font-weight='700' fill='#1f2937'>Fusion / Inventor part</text><text x='46' y='239' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#6b7280'>.f3d / .ipt</text><rect x='330' y='209' width='210' height='30' rx='6' fill='#ea580c'/><text x='435' y='229' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='700' fill='#ffffff'>STEP AP214/AP242</text><text x='560' y='229' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>Solid geometry; feature history is lost</text><rect x='30' y='256' width='920' height='48' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='46' y='277' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' font-weight='700' fill='#1f2937'>3ds Max / Maya scene</text><text x='46' y='295' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#6b7280'>.max / .ma</text><rect x='330' y='265' width='210' height='30' rx='6' fill='#ea580c'/><text x='435' y='285' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='700' fill='#ffffff'>.fbx · .obj · .glb</text><text x='560' y='285' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>Meshes, UVs; plugins and some materials don&#x27;t travel</text><rect x='30' y='312' width='920' height='48' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='46' y='333' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' font-weight='700' fill='#1f2937'>EAGLE board</text><text x='46' y='351' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#6b7280'>.brd / .sch</text><rect x='330' y='321' width='210' height='30' rx='6' fill='#ea580c'/><text x='435' y='341' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='700' fill='#ffffff'>KiCad importer</text><text x='560' y='341' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>KiCad opens EAGLE files directly</text></svg>