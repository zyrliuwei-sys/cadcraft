<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 480' width='980' height='480' role='img' aria-label='Pick a free AutoCAD alternative by what you need: DWG TrueView to view and print DWG, CADCraft for AutoCAD-style 2D, LibreCAD or QCAD Community Edition for simple DXF drafting, FreeCAD for parametric 3D, the AutoCAD education licence for students'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker></defs><rect width='980' height='480' fill='#f8fafc'/><text x='30' y='42' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#111827'>Free AutoCAD alternatives: start from the job</text><rect x='30' y='70' width='560' height='54' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='48' y='103' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#1f2937'>Open, measure and print a DWG someone sent you</text><line x1='592' y1='97' x2='640' y2='97' stroke='#6b7280' stroke-width='1.8' marker-end='url(#a)'/><rect x='644' y='70' width='306' height='54' rx='8' fill='#475569'/><text x='797' y='94' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#ffffff'>DWG TrueView</text><text x='797' y='113' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#f1f5f9'>Windows viewer, no editing</text><rect x='30' y='136' width='560' height='54' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='48' y='169' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#1f2937'>AutoCAD-style 2D: command line, snaps, layouts</text><line x1='592' y1='163' x2='640' y2='163' stroke='#6b7280' stroke-width='1.8' marker-end='url(#a)'/><rect x='644' y='136' width='306' height='54' rx='8' fill='#ea580c'/><text x='797' y='160' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#ffffff'>CADCraft</text><text x='797' y='179' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#f1f5f9'>Any OS or a browser</text><rect x='30' y='202' width='560' height='54' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='48' y='235' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#1f2937'>Simple 2D DXF drafting, also for paid work</text><line x1='592' y1='229' x2='640' y2='229' stroke='#6b7280' stroke-width='1.8' marker-end='url(#a)'/><rect x='644' y='202' width='306' height='54' rx='8' fill='#0891b2'/><text x='797' y='226' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#ffffff'>LibreCAD / QCAD CE</text><text x='797' y='245' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#f1f5f9'>Open source, DXF first</text><rect x='30' y='268' width='560' height='54' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='48' y='301' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#1f2937'>Parametric 3D parts that need 2D drawings</text><line x1='592' y1='295' x2='640' y2='295' stroke='#6b7280' stroke-width='1.8' marker-end='url(#a)'/><rect x='644' y='268' width='306' height='54' rx='8' fill='#2563eb'/><text x='797' y='292' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#ffffff'>FreeCAD</text><text x='797' y='311' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#f1f5f9'>DWG via ODA converter</text><rect x='30' y='334' width='560' height='54' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='48' y='367' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#1f2937'>You are a student or a teacher</text><line x1='592' y1='361' x2='640' y2='361' stroke='#6b7280' stroke-width='1.8' marker-end='url(#a)'/><rect x='644' y='334' width='306' height='54' rx='8' fill='#7c3aed'/><text x='797' y='358' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#ffffff'>AutoCAD Education</text><text x='797' y='377' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='400' fill='#f1f5f9'>Real AutoCAD, no paid work</text><text x='30' y='422' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#4b5563'>Not on the list: nanoCAD Free (non-commercial use only, DWG up to 2013) and DraftSight (no free edition, 30-day trial).</text><text x='30' y='444' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#9ca3af'>Details and sources as of October 2026: cadcraft.org/blog/free-autocad-alternatives</text></svg>