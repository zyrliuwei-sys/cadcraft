<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 372' width='980' height='372' role='img' aria-label='Two real mistakes in an AI-written CAD script: TEXT kept reading the following lines as text, giving 25 text objects and no dimensions until blank lines were added; and dimensions were too small to see in a millimetre drawing until DIMSCALE was set to 200'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker></defs><rect width='980' height='372' fill='#f8fafc'/><text x='30' y='42' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#111827'>Two real mistakes in an AI-written CAD script</text><text x='30' y='66' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#4b5563'>The parking-layout script below, run headless in cadcraft-cli. Counts from cadcraft-cli info.</text><rect x='30' y='86' width='450' height='236' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='48' y='116' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='17' font-weight='800' fill='#111827'>1. TEXT kept reading lines</text><text x='48' y='142' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>Like DTEXT, TEXT takes the next line as more text until it</text><text x='48' y='160' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>meets a blank line.</text><rect x='48' y='180' width='414' height='58' rx='6' fill='#fee2e2'/><text x='60' y='203' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='600' fill='#991b1b'>Run 1: 25 text objects and 0 dimensions. The DIMLINEAR and</text><text x='60' y='221' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='600' fill='#991b1b'>ZOOM lines became labels.</text><rect x='48' y='248' width='414' height='58' rx='6' fill='#dcfce7'/><text x='60' y='271' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='600' fill='#166534'>Fix: a blank line after every TEXT line. Result: 21 texts,</text><text x='60' y='289' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='600' fill='#166534'>3 dimensions.</text><rect x='500' y='86' width='450' height='236' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='518' y='116' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='17' font-weight='800' fill='#111827'>2. Dimensions too small to see</text><text x='518' y='142' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>The drawing is in mm and 25 m wide; default dimension text</text><text x='518' y='160' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>is 2.5 units high.</text><rect x='518' y='180' width='414' height='58' rx='6' fill='#fee2e2'/><text x='530' y='203' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='600' fill='#991b1b'>Run 2: the 3 dimensions exist but render as specks on the</text><text x='530' y='221' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='600' fill='#991b1b'>plan.</text><rect x='518' y='248' width='414' height='58' rx='6' fill='#dcfce7'/><text x='530' y='271' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='600' fill='#166534'>Fix: DIMSCALE 200 and a DIMS layer. Result: readable 2500,</text><text x='530' y='289' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='600' fill='#166534'>5000, 6000.</text><text x='30' y='350' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#4b5563'>Neither error stops the script. Both show up only when you look at the result, so render it every time.</text></svg>