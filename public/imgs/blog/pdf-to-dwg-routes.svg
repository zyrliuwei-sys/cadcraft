<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 540' width='980' height='540' role='img' aria-label='Three routes from a PDF to a DWG: if the PDF is vector and came from CAD, ask for the original DWG or DXF, which keeps layers, blocks and dimensions; if vector with no original, import with PDFIMPORT in AutoCAD or free via Inkscape to DXF into CADCraft, then scale by reference; if scanned, nothing converts — trace over it or redraw. Test by zooming: crisp lines mean vector, pixels mean a scan'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker></defs><rect width='980' height='540' fill='#f8fafc'/><text x='30' y='42' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#111827'>Three routes from PDF to DWG</text><rect x='240' y='70' width='500' height='72' rx='10' fill='#ffffff' stroke='#d1d5db'/><text x='490' y='98' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15.5' font-weight='700' fill='#111827'>First: vector or scanned?</text><text x='490' y='122' text-anchor='middle' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='12.5' font-weight='400' fill='#4b5563'>zoom in — crisp lines are vector, pixels are a scan</text><line x1='470' y1='142' x2='180' y2='186' stroke='#6b7280' stroke-width='1.5' marker-end='url(#a)'/><line x1='490' y1='142' x2='490' y2='186' stroke='#6b7280' stroke-width='1.5' marker-end='url(#a)'/><line x1='510' y1='142' x2='800' y2='186' stroke='#6b7280' stroke-width='1.5' marker-end='url(#a)'/><rect x='30' y='190' width='300' height='240' rx='10' fill='#ffffff' stroke='#d1d5db'/><text x='48' y='218' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15.5' font-weight='700' fill='#15803d'>Vector, from CAD</text><text x='48' y='246' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>Ask for the original DWG</text><text x='48' y='266' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>or DXF — layers, blocks,</text><text x='48' y='286' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>dimensions and true scale</text><text x='48' y='306' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>all intact.</text><rect x='48' y='364' width='264' height='44' rx='8' fill='#f0fdf4' stroke='#bbf7d0'/><text x='60' y='390' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='700' fill='#15803d'>Best result: zero conversion</text><rect x='340' y='190' width='300' height='240' rx='10' fill='#ffffff' stroke='#d1d5db'/><text x='358' y='218' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15.5' font-weight='700' fill='#1d4ed8'>Vector, no original</text><text x='358' y='246' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>AutoCAD: PDFIMPORT (full</text><text x='358' y='266' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>and LT) imports editable</text><text x='358' y='286' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>geometry. Free route: Inkscape</text><text x='358' y='306' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>saves it as DXF — open it</text><text x='358' y='326' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>in CADCraft or AutoCAD.</text><rect x='358' y='364' width='264' height='44' rx='8' fill='#eff6ff' stroke='#bfdbfe'/><text x='370' y='390' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='700' fill='#1d4ed8'>then scale by reference</text><rect x='650' y='190' width='300' height='240' rx='10' fill='#ffffff' stroke='#d1d5db'/><text x='668' y='218' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15.5' font-weight='700' fill='#9a3412'>Scanned or photo</text><text x='668' y='246' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>Nothing can convert it:</text><text x='668' y='266' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>the geometry is not in the</text><text x='668' y='286' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>file. Attach it as an</text><text x='668' y='306' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>underlay and trace, or</text><text x='668' y='326' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>redraw it outright.</text><rect x='668' y='364' width='264' height='44' rx='8' fill='#fff7ed' stroke='#fed7aa'/><text x='680' y='390' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='700' fill='#9a3412'>raster-to-vector is guessing</text><rect x='30' y='450' width='920' height='56' rx='8' fill='#ffffff' stroke='#e5e7eb'/><text x='46' y='474' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='700' fill='#111827'>After any import: scale by reference (measure a known size), then JOIN and OVERKILL.</text><text x='46' y='494' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>A PDF stores what was printed, not what was drawn — geometry travels, intelligence does not.</text></svg>
