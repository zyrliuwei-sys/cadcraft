<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 390' width='980' height='390' role='img' aria-label='CAD versus AutoCAD: CAD is a category of software dating from the 1960s, free to very expensive, in many file formats and kinds; AutoCAD is Autodesk&#x27;s program, first released in December 1982, sold by subscription, built around DWG and mainly 2D drafting'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker></defs><rect width='980' height='390' fill='#f8fafc'/><text x='30' y='42' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#111827'>CAD vs AutoCAD at a glance</text><text x='250' y='78' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#334155'>CAD (the category)</text><text x='610' y='78' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#9a3412'>AutoCAD (the product)</text><rect x='30' y='90' width='920' height='40' rx='8' fill='#ffffff' stroke='#e5e7eb'/><text x='46' y='115' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#1f2937'>What it is</text><text x='250' y='115' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>A kind of software (and a job: drafting)</text><text x='610' y='115' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>A specific program made by Autodesk</text><rect x='30' y='138' width='920' height='40' rx='8' fill='#ffffff' stroke='#e5e7eb'/><text x='46' y='163' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#1f2937'>First appeared</text><text x='250' y='163' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>1960s (Sketchpad, 1963)</text><text x='610' y='163' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>December 1982</text><rect x='30' y='186' width='920' height='40' rx='8' fill='#ffffff' stroke='#e5e7eb'/><text x='46' y='211' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#1f2937'>Price</text><text x='250' y='211' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>Free to tens of thousands a year</text><text x='610' y='211' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>Subscription only</text><rect x='30' y='234' width='920' height='40' rx='8' fill='#ffffff' stroke='#e5e7eb'/><text x='46' y='259' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#1f2937'>Files</text><text x='250' y='259' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>DWG, DXF, STEP, IFC, STL… depends on the tool</text><text x='610' y='259' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>DWG native; DXF, PDF, DGN and more</text><rect x='30' y='282' width='920' height='40' rx='8' fill='#ffffff' stroke='#e5e7eb'/><text x='46' y='307' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#1f2937'>Dimensions</text><text x='250' y='307' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>2D drawings, 3D solids, BIM, PCBs…</text><text x='610' y='307' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>Mainly 2D drafting, some 3D</text><rect x='30' y='330' width='920' height='40' rx='8' fill='#ffffff' stroke='#e5e7eb'/><text x='46' y='355' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#1f2937'>&quot;Do the CAD&quot;</text><text x='250' y='355' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>Make the technical drawing, in any tool</text><text x='610' y='355' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='400' fill='#374151'>Make it in AutoCAD specifically</text></svg>