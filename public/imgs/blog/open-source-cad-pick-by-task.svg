<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 940 470' width='940' height='470' role='img' aria-label='Pick an open source CAD tool by job: FreeCAD for parametric 3D, OpenSCAD for code-defined parts, LibreCAD for lightweight 2D, QCAD for polished 2D, SolveSpace for constraint sketches, CADCraft for AutoCAD-style 2D and automation'>
<defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker></defs>
<rect width='940' height='470' fill='#f8fafc'/><text x='30' y='42' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#111827'>Pick by the job, not by a ranking</text><rect x='30' y='70' width='620' height='46' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='48' y='99' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' fill='#1f2937'>Parametric 3D parts, assemblies, FEM</text><line x1='652' y1='93' x2='708' y2='93' stroke='#6b7280' stroke-width='1.8' marker-end='url(#a)'/><rect x='712' y='70' width='200' height='46' rx='8' fill='#2563eb'/><text x='812' y='99' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#ffffff'>FreeCAD</text><rect x='30' y='130' width='620' height='46' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='48' y='159' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' fill='#1f2937'>Code-defined parts you want to diff and version</text><line x1='652' y1='153' x2='708' y2='153' stroke='#6b7280' stroke-width='1.8' marker-end='url(#a)'/><rect x='712' y='130' width='200' height='46' rx='8' fill='#7c3aed'/><text x='812' y='159' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#ffffff'>OpenSCAD</text><rect x='30' y='190' width='620' height='46' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='48' y='219' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' fill='#1f2937'>Lightweight 2D DXF drafting, old hardware</text><line x1='652' y1='213' x2='708' y2='213' stroke='#6b7280' stroke-width='1.8' marker-end='url(#a)'/><rect x='712' y='190' width='200' height='46' rx='8' fill='#0891b2'/><text x='812' y='219' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#ffffff'>LibreCAD</text><rect x='30' y='250' width='620' height='46' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='48' y='279' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' fill='#1f2937'>2D drafting with more polish; paid DWG option</text><line x1='652' y1='273' x2='708' y2='273' stroke='#6b7280' stroke-width='1.8' marker-end='url(#a)'/><rect x='712' y='250' width='200' height='46' rx='8' fill='#0d9488'/><text x='812' y='279' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#ffffff'>QCAD</text><rect x='30' y='310' width='620' height='46' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='48' y='339' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' fill='#1f2937'>Constraint-based sketches → simple 3D</text><line x1='652' y1='333' x2='708' y2='333' stroke='#6b7280' stroke-width='1.8' marker-end='url(#a)'/><rect x='712' y='310' width='200' height='46' rx='8' fill='#4f46e5'/><text x='812' y='339' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#ffffff'>SolveSpace</text><rect x='30' y='370' width='620' height='46' rx='8' fill='#ffffff' stroke='#d1d5db'/><text x='48' y='399' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' fill='#1f2937'>AutoCAD-style 2D, browser, scripting, AI agents</text><line x1='652' y1='393' x2='708' y2='393' stroke='#6b7280' stroke-width='1.8' marker-end='url(#a)'/><rect x='712' y='370' width='200' height='46' rx='8' fill='#ea580c'/><text x='812' y='399' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' fill='#ffffff'>CADCraft</text><text x='30' y='448' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#6b7280'>Order is arbitrary. Most people end up using two of these.</text>
<text x='924' y='458' text-anchor='end' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#9ca3af'>cadcraft.org (independent guide)</text></svg>