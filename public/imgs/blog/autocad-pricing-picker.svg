<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 470' width='980' height='470' role='img' aria-label='Which option fits: an employer or client pays means full AutoCAD, the industry default with every specialized toolset included; a student or teacher means the free education plan; 2D drafting on a budget means AutoCAD LT or the free CADCraft, LibreCAD and QCAD; only a few days of use a month means Flex tokens cost less than a subscription; if you mainly exchange DWG files, any honest DWG editor works and the workflow skills transfer'><rect width='980' height='470' fill='#f8fafc'/><text x='30' y='42' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#111827'>Which one fits you?</text><rect x='30' y='70' width='450' height='160' rx='10' fill='#ffffff' stroke='#d1d5db'/><text x='48' y='100' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15.5' font-weight='700' fill='#1d4ed8'>Employer or client pays</text><text x='48' y='128' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>Full AutoCAD. The industry default,</text><text x='48' y='148' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>every specialized toolset included,</text><text x='48' y='168' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>and no compatibility questions.</text><rect x='500' y='70' width='450' height='160' rx='10' fill='#ffffff' stroke='#d1d5db'/><text x='518' y='100' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15.5' font-weight='700' fill='#15803d'>Student or teacher</text><text x='518' y='128' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>The education plan: the real</text><text x='518' y='148' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>program, free, renewable yearly.</text><text x='518' y='168' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>Add a study roadmap and it is set.</text><rect x='30' y='246' width='450' height='160' rx='10' fill='#ffffff' stroke='#d1d5db'/><text x='48' y='276' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15.5' font-weight='700' fill='#a16207'>2D drafting, own budget</text><text x='48' y='304' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>AutoCAD LT — or genuinely free:</text><text x='48' y='324' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>CADCraft keeps the AutoCAD commands</text><text x='48' y='344' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>and reads and writes DWG and DXF;</text><text x='48' y='364' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>LibreCAD and QCAD are free too.</text><rect x='500' y='246' width='450' height='160' rx='10' fill='#ffffff' stroke='#d1d5db'/><text x='518' y='276' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15.5' font-weight='700' fill='#0e7490'>A few days a month</text><text x='518' y='304' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>Flex tokens, billed per day actually</text><text x='518' y='324' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>used. Below about a week a month</text><text x='518' y='344' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>it costs less than a year-round</text><text x='518' y='364' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>subscription.</text><rect x='30' y='422' width='920' height='36' rx='8' fill='#ffffff' stroke='#e5e7eb'/><text x='46' y='445' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>Mostly exchanging DWG files? Any honest DWG editor does — the workflow skills transfer.</text></svg>
