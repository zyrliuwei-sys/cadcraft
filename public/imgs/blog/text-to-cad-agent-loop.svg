<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1140 400' width='1140' height='400' role='img' aria-label='Text to CAD loop: you write the prompt, a language model writes commands, the CADCraft MCP server runs them, the agent checks the result with query_entities and render, fixes and retries, then saves DXF or PDF'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker></defs><rect width='1140' height='400' fill='#f8fafc'/><text x='30' y='36' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#111827'>Text to CAD with CADCraft: who does what</text><rect x='30' y='70' width='230' height='120' rx='10' fill='#ffffff' stroke='#1f2937' stroke-width='1.5'/><rect x='30' y='70' width='6' height='120' rx='3' fill='#6b7280'/><text x='48' y='98' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='17' font-weight='700' fill='#111827'>1. You</text><text x='48' y='122' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#374151'>Write every size,</text><text x='48' y='143' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#374151'>position and layer</text><text x='48' y='164' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#374151'>in the prompt.</text><rect x='310' y='70' width='250' height='120' rx='10' fill='#ffffff' stroke='#1f2937' stroke-width='1.5'/><rect x='310' y='70' width='6' height='120' rx='3' fill='#7c3aed'/><text x='328' y='98' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='17' font-weight='700' fill='#111827'>2. Language model</text><text x='328' y='122' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#374151'>Turns the prompt into</text><text x='328' y='143' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#374151'>CAD commands.</text><text x='328' y='164' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#374151'>(Not part of CADCraft.)</text><rect x='610' y='70' width='250' height='120' rx='10' fill='#ffffff' stroke='#1f2937' stroke-width='1.5'/><rect x='610' y='70' width='6' height='120' rx='3' fill='#2563eb'/><text x='628' y='98' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='17' font-weight='700' fill='#111827'>3. MCP server</text><text x='628' y='122' font-family='SFMono-Regular,Menlo,Consolas,monospace' font-size='14' fill='#374151'>cadcraft-cli mcp</text><text x='628' y='143' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#374151'>command_line, script,</text><text x='628' y='164' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#374151'>execute …</text><rect x='910' y='70' width='200' height='120' rx='10' fill='#ffffff' stroke='#1f2937' stroke-width='1.5'/><rect x='910' y='70' width='6' height='120' rx='3' fill='#16a34a'/><text x='928' y='98' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='17' font-weight='700' fill='#111827'>4. CADCraft</text><text x='928' y='122' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#374151'>Runs the commands</text><text x='928' y='143' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#374151'>in a 2D drawing.</text><line x1='260' y1='130' x2='308' y2='130' stroke='#6b7280' stroke-width='2' marker-end='url(#a)'/><line x1='560' y1='130' x2='608' y2='130' stroke='#6b7280' stroke-width='2' marker-end='url(#a)'/><line x1='860' y1='130' x2='908' y2='130' stroke='#6b7280' stroke-width='2' marker-end='url(#a)'/><rect x='610' y='250' width='500' height='120' rx='10' fill='#ffffff' stroke='#1f2937' stroke-width='1.5'/><rect x='610' y='250' width='6' height='120' rx='3' fill='#ea580c'/><text x='628' y='278' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='17' font-weight='700' fill='#111827'>5. Check before you trust it</text><text x='628' y='302' font-family='SFMono-Regular,Menlo,Consolas,monospace' font-size='14' fill='#374151'>query_entities, inspect_drawing</text><text x='628' y='323' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#374151'>→ sizes, layers, counts as JSON</text><text x='628' y='344' font-family='SFMono-Regular,Menlo,Consolas,monospace' font-size='14' fill='#374151'>render → a PNG the model can look at</text><path d='M1010,190 L1010,248' stroke='#6b7280' stroke-width='2' fill='none' marker-end='url(#a)'/><path d='M608,310 L435,310 L435,192' stroke='#6b7280' stroke-width='2' fill='none' marker-end='url(#a)'/><text x='520' y='300' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#6b7280' text-anchor='middle'>fix and retry</text><rect x='30' y='250' width='370' height='120' rx='10' fill='#ffffff' stroke='#1f2937' stroke-width='1.5'/><rect x='30' y='250' width='6' height='120' rx='3' fill='#0891b2'/><text x='48' y='278' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='17' font-weight='700' fill='#111827'>6. Save</text><text x='48' y='302' font-family='SFMono-Regular,Menlo,Consolas,monospace' font-size='14' fill='#374151'>save {"path": "part.dxf"}</text><text x='48' y='323' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#374151'>DXF, DWG, or PDF / SVG / PNG export</text><text x='48' y='344' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#374151'>Open it at /online or in the desktop app</text><path d='M608,345 L402,345' stroke='#6b7280' stroke-width='2' fill='none' marker-end='url(#a)'/></svg>