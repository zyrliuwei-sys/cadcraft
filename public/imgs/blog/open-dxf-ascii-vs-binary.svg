<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1130 456' width='1130' height='456' role='img' aria-label='An ASCII DXF starts with group code 0 and SECTION and shows the version code after $ACADVER; a binary DXF starts with the sentinel AutoCAD Binary DXF'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker></defs><rect width='1130' height='456' fill='#f8fafc'/><text x='30' y='36' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#111827'>ASCII or binary DXF? Look at the first bytes</text><rect x='30' y='64' width='520' height='250' rx='10' fill='#ffffff' stroke='#1f2937' stroke-width='1.5'/><rect x='30' y='64' width='6' height='250' rx='3' fill='#16a34a'/><text x='48' y='92' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='17' font-weight='700' fill='#111827'>ASCII DXF (most files)</text><text x='48' y='116' font-family='SFMono-Regular,Menlo,Consolas,monospace' font-size='14' fill='#374151'>  0</text><text x='48' y='137' font-family='SFMono-Regular,Menlo,Consolas,monospace' font-size='14' fill='#374151'>SECTION</text><text x='48' y='158' font-family='SFMono-Regular,Menlo,Consolas,monospace' font-size='14' fill='#374151'>  2</text><text x='48' y='179' font-family='SFMono-Regular,Menlo,Consolas,monospace' font-size='14' fill='#374151'>HEADER</text><text x='48' y='200' font-family='SFMono-Regular,Menlo,Consolas,monospace' font-size='14' fill='#374151'>  9</text><text x='48' y='221' font-family='SFMono-Regular,Menlo,Consolas,monospace' font-size='14' fill='#374151'>$ACADVER</text><text x='48' y='242' font-family='SFMono-Regular,Menlo,Consolas,monospace' font-size='14' fill='#374151'>  1</text><text x='48' y='263' font-family='SFMono-Regular,Menlo,Consolas,monospace' font-size='14' fill='#374151'>AC1032   ← version code (2018)</text><rect x='590' y='64' width='510' height='250' rx='10' fill='#ffffff' stroke='#1f2937' stroke-width='1.5'/><rect x='590' y='64' width='6' height='250' rx='3' fill='#2563eb'/><text x='608' y='92' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='17' font-weight='700' fill='#111827'>Binary DXF</text><text x='608' y='116' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#374151'>Starts with the 22-byte sentinel:</text><text x='608' y='137' font-family='SFMono-Regular,Menlo,Consolas,monospace' font-size='14' fill='#374151'>AutoCAD Binary DXF\r\n\x1a\x00</text><text x='608' y='158' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#374151'>Then binary group codes and values.</text><text x='608' y='179' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#374151'>The version code is still plain text:</text><text x='608' y='200' font-family='SFMono-Regular,Menlo,Consolas,monospace' font-size='14' fill='#374151'>… $ACADVER … AC1032 …</text><text x='608' y='221' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#374151'>CADCraft reads binary DXF from R13 on,</text><text x='608' y='242' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#374151'>but not R12 (AC1009) binary.</text><rect x='30' y='334' width='1070' height='96' rx='10' fill='#ffffff' stroke='#1f2937' stroke-width='1.5'/><rect x='30' y='334' width='6' height='96' rx='3' fill='#ea580c'/><text x='48' y='362' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='17' font-weight='700' fill='#111827'>Check it from a terminal</text><text x='48' y='386' font-family='SFMono-Regular,Menlo,Consolas,monospace' font-size='14' fill='#374151'>head -c 22 drawing.dxf | od -c | head -2        # ASCII or binary</text><text x='48' y='407' font-family='SFMono-Regular,Menlo,Consolas,monospace' font-size='14' fill='#374151'>grep -a -o "AC10[0-9][0-9]" drawing.dxf | head -1  # version code</text></svg>