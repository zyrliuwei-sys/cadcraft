<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 480' width='980' height='480' role='img' aria-label='Model space versus paper space: on the left the Model tab, where a floor plan is drawn at real size, one unit equals one millimetre, with a 4000 wall dimension. On the right a Layout tab showing an A3 sheet at 420 by 297 with a title block strip and a dashed viewport containing the same plan at 1:100. Double-click inside a viewport to work on the model through it, PS to come back'><rect width='980' height='480' fill='#f8fafc'/><text x='30' y='42' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='22' font-weight='800' fill='#111827'>Two spaces, one drawing</text><rect x='30' y='70' width='440' height='310' rx='10' fill='#ffffff' stroke='#d1d5db'/><text x='48' y='98' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15.5' font-weight='700' fill='#111827'>Model space — the Model tab</text><text x='48' y='122' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='12.5' font-weight='400' fill='#4b5563'>1 unit = 1 mm · everything at real size</text><path fill-rule='evenodd' fill='none' stroke='#111827' stroke-width='1.6' d='M90,340 L420,340 L420,150 L90,150 Z M96,334 L414,334 L414,156 L96,156 Z'/><line x1='250' y1='156' x2='250' y2='280' stroke='#111827' stroke-width='1.2'/><line x1='330' y1='334' x2='330' y2='290' stroke='#16a34a' stroke-width='1.4'/><path d='M330,290 A44,44 0 0 1 374,334' fill='none' stroke='#16a34a' stroke-width='1.2'/><line x1='90' y1='360' x2='250' y2='360' stroke='#0891b2' stroke-width='1'/><line x1='86' y1='356' x2='94' y2='364' stroke='#0891b2' stroke-width='1.4'/><line x1='246' y1='356' x2='254' y2='364' stroke='#0891b2' stroke-width='1.4'/><line x1='90' y1='344' x2='90' y2='366' stroke='#0891b2' stroke-width='0.8'/><line x1='250' y1='344' x2='250' y2='366' stroke='#0891b2' stroke-width='0.8'/><text x='170' y='356' text-anchor='middle' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' font-weight='400' fill='#0e7490'>4000</text><rect x='510' y='70' width='440' height='310' rx='10' fill='#ffffff' stroke='#d1d5db'/><text x='528' y='98' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15.5' font-weight='700' fill='#111827'>Paper space — a Layout tab</text><text x='528' y='122' text-anchor='start' font-family='JetBrains Mono,Menlo,Consolas,monospace' font-size='12.5' font-weight='400' fill='#4b5563'>the sheet itself · A3 = 420 × 297</text><rect x='570' y='145' width='310' height='195' fill='#ffffff' stroke='#111827' stroke-width='1.6'/><rect x='830' y='145' width='50' height='195' fill='#e5e7eb' opacity='0.6'/><rect x='570' y='315' width='260' height='25' fill='#e5e7eb' opacity='0.6'/><rect x='585' y='160' width='230' height='140' fill='none' stroke='#2563eb' stroke-width='1.6' stroke-dasharray='7,5'/><path fill-rule='evenodd' fill='none' stroke='#111827' stroke-width='1.2' d='M620,275 L780,275 L780,185 L620,185 Z M625,270 L775,270 L775,190 L625,190 Z'/><line x1='700' y1='190' x2='700' y2='240' stroke='#111827' stroke-width='1'/><text x='590' y='178' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' font-weight='700' fill='#2563eb'>viewport · 1:100</text><text x='528' y='368' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' font-weight='400' fill='#6b7280'>double-click inside to reach the model · PS to come back</text><rect x='30' y='400' width='920' height='56' rx='8' fill='#ffffff' stroke='#e5e7eb'/><text x='46' y='424' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='700' fill='#111827'>A viewport (MVIEW) is a window onto the model, set to a scale — then locked.</text><text x='46' y='444' text-anchor='start' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='400' fill='#374151'>Geometry lives in model space at 1:1; the sheet, title block and viewports live on the layout.</text></svg>
